<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Link styled as a button -->
<a th:fragment="linkButton"
   th:href="${href}"
   th:target="${target}"
   th:class="${(variant == 'secondary' ? 'btn-secondary' : (variant == 'outline' ? 'btn-outline' : (variant == 'danger' ? 'btn-danger' : (variant == 'ghost' ? 'btn-ghost' : (variant == 'icon' ? 'btn-icon' : 'btn-primary'))))) + (size == 'sm' ? ' btn-sm' : '') + (cls != null ? ' ' + cls : '')}">
    <th:block th:if="${icon != null and iconPos != 'right'}">
        <span th:replace="~{fragments/icon :: icon(name=${icon}, size=${size == 'sm' ? 'sm' : 'md'})}"></span>
    </th:block>
    <span th:if="${label != null}" th:text="${label}">Link</span>
    <th:block th:if="${icon != null and iconPos == 'right'}">
        <span th:replace="~{fragments/icon :: icon(name=${icon}, size=${size == 'sm' ? 'sm' : 'md'})}"></span>
    </th:block>
</a>

<!-- Button element -->
<button th:fragment="actionButton"
        th:type="${type ?: 'button'}"
        th:name="${name}"
        th:value="${value}"
        th:disabled="${disabled == true}"
        th:class="${(variant == 'secondary' ? 'btn-secondary' : (variant == 'outline' ? 'btn-outline' : (variant == 'danger' ? 'btn-danger' : (variant == 'ghost' ? 'btn-ghost' : (variant == 'icon' ? 'btn-icon' : 'btn-primary'))))) + (size == 'sm' ? ' btn-sm' : '') + (cls != null ? ' ' + cls : '')}">
    <th:block th:if="${icon != null and iconPos != 'right'}">
        <span th:replace="~{fragments/icon :: icon(name=${icon}, size=${size == 'sm' ? 'sm' : 'md'})}"></span>
    </th:block>
    <span th:if="${label != null}" th:text="${label}">Button</span>
    <th:block th:if="${icon != null and iconPos == 'right'}">
        <span th:replace="~{fragments/icon :: icon(name=${icon}, size=${size == 'sm' ? 'sm' : 'md'})}"></span>
    </th:block>
</button>

<!-- Icon-only button or link -->
<th:block th:fragment="iconButton">
    <a th:if="${href != null}"
       th:href="${href}"
       th:target="${target}"
       th:attr="aria-label=${label}, title=${label}"
       class="btn-icon"
       th:classappend="${(size == 'sm' ? ' btn-sm' : '') + (variant == 'primary' ? ' bg-primary text-on-primary hover:bg-primary-hover' : '') + (cls != null ? ' ' + cls : '')}">
        <span th:replace="~{fragments/icon :: icon(name=${icon}, size=${size == 'sm' ? 'sm' : 'md'})}"></span>
    </a>
    <button th:if="${href == null}"
            th:type="${type ?: 'button'}"
            th:name="${name}"
            th:value="${value}"
            th:disabled="${disabled == true}"
            th:attr="aria-label=${label}, title=${label}"
            class="btn-icon"
            th:classappend="${(size == 'sm' ? ' btn-sm' : '') + (variant == 'primary' ? ' bg-primary text-on-primary hover:bg-primary-hover' : '') + (cls != null ? ' ' + cls : '')}">
        <span th:replace="~{fragments/icon :: icon(name=${icon}, size=${size == 'sm' ? 'sm' : 'md'})}"></span>
    </button>
</th:block>

<!-- Form submit and cancel row -->
<div th:fragment="submitRow"
     class="flex items-center justify-end gap-3 pt-4 border-t border-outline-variant"
     th:classappend="${cls}">
    <a th:href="${cancelHref ?: 'javascript:history.back()'}"
       class="btn-outline"
       th:text="${cancelLabel ?: 'Cancel'}">Cancel</a>
    <button type="submit" class="btn-primary">
        <th:block th:if="${submitIcon != null}">
            <span th:replace="~{fragments/icon :: icon(name=${submitIcon})}"></span>
        </th:block>
        <span th:text="${submitLabel ?: 'Save changes'}">Save changes</span>
    </button>
</div>

</body>
</html>
