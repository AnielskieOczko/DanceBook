<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="activeNav='training-events'" class="space-y-lg">

    <div th:replace="~{fragments/page :: pageHeader(title=#{nav.training}, subtitle=#{training.history.subtitle}, toolbar=~{::historyToolbar})}">
        <div th:fragment="historyToolbar" class="flex flex-wrap items-center gap-4 max-w-full">
            <div th:replace="~{fragments/calendar-selector :: calendarSelector}"></div>
            <nav th:replace="~{fragments/page :: viewSwitcher(currentView='history')}"></nav>
        </div>
    </div>

    <th:block th:if="${selectableCalendars == null || selectableCalendars.isEmpty()}">
        <div th:replace="~{fragments/empty :: emptyState(
            icon='calendar_month',
            title=#{training.empty.no_calendars_title},
            text=#{training.empty.no_calendars_text},
            actionHref='/training-calendars/new',
            actionLabel=#{training.empty.no_calendars_action})}"></div>
    </th:block>

    <th:block th:if="${selectableCalendars != null && !selectableCalendars.isEmpty() && history.isEmpty}">
        <div th:replace="~{fragments/empty :: emptyState(icon='history', title=#{training.history.empty_title}, text=#{training.history.empty_text}, actionHref='/training-events', actionLabel=#{training.history.empty_action})}"></div>
    </th:block>

    <!-- Shown only when there is something to explain: an orphaned row is the one row on this
         page that cannot be corrected from the calendar, so it needs a sentence. -->
    <div th:if="${history.orphanedCount > 0}"
         class="card p-4 flex items-start gap-3 font-body-md text-[14px] text-on-surface-variant">
        <span th:replace="~{fragments/icon :: icon(name='info', size='md', cls='text-secondary shrink-0')}"></span>
        <p>
            <span th:text="${history.orphanedExplanation}">This session has been deleted from your calendar.</span>
            <span th:text="#{training.history.orphaned_note}">The record stays, so your hours and streak stand. If you marked it by mistake, remove
            the record here.</span>
        </p>
    </div>

    <div th:each="month : ${history.months}" class="space-y-gutter">

        <div class="tc-month-heading">
            <h2 class="font-headline-md text-xl font-semibold text-on-surface" th:text="${month.label}">September 2026</h2>
            <p class="font-body-md text-[14px] text-on-surface-variant tabular-nums">
                <span th:text="${month.sessionLabel}">6 sessions</span>
                <span class="text-outline"> · </span>
                <span th:text="${month.totalLabel}">9h 30m</span> <span th:text="#{dashboard.month.trained}">trained</span>
            </p>
        </div>

        <div class="space-y-3">
            <div th:each="row : ${month.rows}" th:with="record=${row.record}"
                 class="card p-4 sm:p-5 flex items-start gap-3 sm:gap-4">

                <!-- Date rail; the stripe and tint are the recorded outcome. -->
                <div class="tc-rail"
                     th:style="'border-left-color:' + ${row.swatch.color} + ';background-color:' + ${row.swatch.tint}">
                    <span class="tc-rail-day" th:text="${#temporals.format(record.occurredAt, 'd')}">10</span>
                    <span class="tc-rail-weekday" th:text="${#temporals.format(record.occurredAt, 'EEE')}">Thu</span>
                </div>

                <div class="flex-1 min-w-0">
                    <!-- A linked record still has a session to open; an orphaned one has nothing
                         to link to, so it is plain text rather than a link that 404s. -->
                    <a th:unless="${row.isOrphaned}"
                       th:href="@{/training-events/{id}(id=${record.trainingEventId})}"
                       class="block truncate font-headline-lg text-base sm:text-lg font-semibold text-on-surface
                              hover:text-primary transition-colors"
                       th:text="${record.title}">Monday practice</a>
                    <p th:if="${row.isOrphaned}"
                       class="block truncate font-headline-lg text-base sm:text-lg font-semibold text-on-surface"
                       th:text="${record.title}">Monday practice</p>

                    <p class="font-body-md text-[14px] sm:text-body-md text-on-surface-variant mt-0.5 tabular-nums">
                        <span th:text="${#temporals.format(record.occurredAt, 'HH:mm')}">18:00</span>
                        <span class="text-outline"> · </span>
                        <span th:text="#{training.minutes(${record.durationMinutes})}">120 min</span>
                    </p>

                    <div class="tc-badges mt-2">
                        <span class="badge-primary" th:text="${record.eventType}">TRAINING</span>

                        <span th:each="segment : ${record.segments}" class="badge-secondary"
                              th:text="#{training.segment_label(${segment.label}, ${segment.durationMinutes})}">Standard 60min</span>

                        <span th:replace="~{fragments/badge :: attendanceBadge(status=${record.outcome})}"></span>

                        <span th:if="${row.isOrphaned}" class="badge-neutral" th:text="#{training.history.session_deleted}">Session deleted</span>
                    </div>
                </div>

                <!-- Only orphaned records are removable here. While the session exists, the way
                     to correct a mis-mark is to change its attendance, which rewrites this row. -->
                <form th:if="${row.isOrphaned}"
                      th:action="@{/training-events/history/{id}/delete(id=${record.id})}" method="post"
                      class="shrink-0"
                      data-confirm="Remove this training record? Your hours and attendance rate will be recalculated without it."
                      th:attr="data-confirm=#{training.history.remove_confirm}">
                    <button type="submit" class="btn-outline text-error hover:bg-error-soft/20 border-error/30 hover:border-error flex items-center gap-1.5" th:aria-label="#{training.history.remove_aria(${record.title})}">
                        <span th:replace="~{fragments/icon :: icon(name='delete', size='md')}"></span>
                        <span th:text="#{training.history.remove}">Remove</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
</html>
