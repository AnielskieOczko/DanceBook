<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<!-- The home page, built around wrapping up a session (#147). Each block is a fragment under
     templates/home/, so the attendance answer can swap the wrap-up section without re-rendering
     the page. On a phone the blocks stack in DOM order; from 1024px they fill a three-column grid. -->
<section class="flex flex-col gap-6 lg:gap-8">

    <div th:replace="~{fragments/page :: pageHeader(title=${dashboard.greeting}, subtitle=${dashboard.dateLabel}, titleCls='!font-serif !font-normal', toolbar=~{home/new-menu :: homeNewMenu})}"></div>

    <div th:replace="~{home/week :: homeWeek}"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8">
        <div class="min-w-0 lg:col-span-2 lg:row-start-1"><div th:replace="~{home/wrap-up :: homeWrapUp}"></div></div>
        <div class="min-w-0 lg:col-span-2 lg:row-start-2"><div th:replace="~{home/recent-notes :: homeRecentNotes}"></div></div>
        <div class="min-w-0 lg:col-start-3 lg:row-start-1"><div th:replace="~{home/month :: homeMonth}"></div></div>
        <div class="min-w-0 lg:col-start-3 lg:row-start-2"><div th:replace="~{home/continue :: homeContinue}"></div></div>
    </div>

</section>
