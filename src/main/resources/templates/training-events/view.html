<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="activeNav='training-events'" class="max-w-3xl mx-auto space-y-12">

    <div th:replace="~{fragments/page :: pageHeader(
        backHref='/training-events',
        backLabel=#{training.back_to_list},
        title=${event.title},
        subtitleSlot=~{::eventSubtitle},
        primaryUrl=@{/training-events/{id}/edit(id=${event.id})},
        primaryText=#{common.edit},
        primaryIcon='edit',
        hasPrimary=${currentUser != null and (event.calendar == null or event.calendar.owner?.id == currentUser.id or currentUser.role.name() == 'ADMIN')},
        menuSlot=~{::eventMenu},
        hasMenu=${currentUser != null and (event.calendar == null or event.calendar.owner?.id == currentUser.id or currentUser.role.name() == 'ADMIN')})}">

        <th:block th:fragment="eventSubtitle">
            <p class="page-subtitle">
                <span th:text="${#temporals.format(event.startTime, 'EEEE, MMMM d yyyy · HH:mm')}">Thursday, September 10 2026 · 18:00</span>
                <span> – </span>
                <span th:text="${#temporals.format(event.endTime, 'HH:mm')}">20:00</span>
            </p>
        </th:block>

        <th:block th:fragment="eventMenu">
            <button th:if="${event.series != null}"
                    type="button"
                    class="flex items-center gap-2.5 w-full text-left px-3.5 py-2.5 min-h-[44px] rounded-lg text-sm font-medium text-danger hover:bg-danger-soft transition-colors cursor-pointer select-none"
                    aria-label="Delete"
                    th:attr="aria-label=#{common.delete}"
                    th:hx-get="@{/training-events/{id}/delete-dialog(id=${event.id})}"
                    hx-target="#confirmModalContainer"
                    hx-swap="innerHTML">
                <span th:replace="~{fragments/icon :: icon(name='delete', size='sm', cls='text-danger')}"></span>
                <span th:text="#{common.delete}">Delete</span>
            </button>
            <form th:if="${event.series == null}"
                  th:action="@{/training-events/{id}/delete(id=${event.id})}" method="post"
                  data-confirm="Delete this training session? It will also be removed from your Google Calendar."
                  th:attr="data-confirm=#{training.delete_confirm}">
                <button type="submit"
                        class="flex items-center gap-2.5 w-full text-left px-3.5 py-2.5 min-h-[44px] rounded-lg text-sm font-medium text-danger hover:bg-danger-soft transition-colors cursor-pointer select-none">
                    <span th:replace="~{fragments/icon :: icon(name='delete', size='sm', cls='text-danger')}"></span>
                    <span th:text="#{common.delete}">Delete</span>
                </button>
            </form>
        </th:block>
    </div>

    <div class="card p-8 space-y-6">
        <h2 class="text-xl font-bold text-on-surface border-b border-border pb-3 flex items-center gap-2">
            <span th:replace="~{fragments/icon :: icon(name='event', size='md', cls='text-primary')}"></span>
            <span th:text="#{training.view.session_details}">Session details</span>
        </h2>

        <div class="flex flex-wrap items-center gap-2">
            <span class="badge-primary" th:text="${#messages.msg('enum.training_event_type.' + event.eventType.name())}">TRAINING</span>
            <span th:if="${event.series != null}" class="badge-neutral flex items-center gap-1">
                <span th:replace="~{fragments/icon :: icon(name='event_repeat', size='sm')}"></span>
                <span th:text="#{training.view.repeating_series}">Repeating series</span>
            </span>
            <span th:each="segment : ${event.segments}" class="badge-secondary"
                  th:text="#{training.segment_label(${segment.danceCategory.name}, ${segment.durationMinutes})}">Standard 60min</span>
            <span th:replace="~{fragments/badge :: attendanceBadge(status=${event.attendanceFor(currentUser)}, unconfirmed=${event.isAwaitingConfirmationFor(currentUser)})}"></span>
            <span class="badge-neutral" th:text="#{training.minutes(${event.durationMinutes})}">120 min</span>
        </div>

        <!-- Confirm a past session that was never marked either way -->
        <div th:if="${event.isAwaitingConfirmationFor(currentUser)}" class="flex items-center gap-3 pt-2">
            <form th:action="@{/training-events/{id}/attendance(id=${event.id})}" method="post">
                <input type="hidden" name="status" value="ATTENDED">
                <button type="submit" class="btn-primary" th:text="#{training.view.i_attended}">I attended</button>
            </form>
            <form th:action="@{/training-events/{id}/attendance(id=${event.id})}" method="post">
                <input type="hidden" name="status" value="SKIPPED">
                <button type="submit" class="btn-outline" th:text="#{training.view.i_skipped}">I skipped</button>
            </form>
        </div>

        <div th:if="${event.description != null}">
            <h3 class="form-label" th:text="#{training.form.field.notes}">Notes</h3>
            <div th:replace="~{fragments/rich-text :: content(value=${event.description}, cls='font-body-md text-body-md text-on-surface-variant leading-relaxed')}"></div>
        </div>

        <div th:if="${event.material != null}">
            <h3 class="form-label" th:text="#{training.view.linked_material}">Linked note</h3>
            <a th:href="@{/materials/{id}(id=${event.material.id})}"
               class="font-semibold text-primary hover:underline" th:text="${event.material.name}">Waltz basics</a>
        </div>

        <div th:if="${event.materialsUrl != null}">
            <h3 class="form-label" th:text="#{training.view.external_materials}">External materials</h3>
            <a th:href="${event.materialsUrl}" target="_blank" rel="noopener noreferrer"
               class="font-semibold text-primary hover:underline break-all" th:text="${event.materialsUrl}">https://...</a>
        </div>

        <p class="font-label-sm text-label-sm text-outline pt-4 border-t border-border"
           th:text="#{training.view.added_by(${event.createdBy?.displayName ?: ''}, ${#temporals.format(event.createdAt, 'MMMM d yyyy')})}">
            Added by Test User on September 6 2026
        </p>
    </div>
</section>

</html>
