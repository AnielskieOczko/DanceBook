<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="activeNav='choreographies'" class="max-w-3xl mx-auto py-12">

    <div th:replace="~{fragments/page :: header(title=${choreographyId == null ? 'New Choreography' : 'Edit Choreography Details'}, subtitle='Set up your choreography metadata. You can add figures to the routine in the next step.')}"></div>

    <form th:action="@{${choreographyId == null ? '/choreographies' : '/choreographies/' + choreographyId + '/metadata'}}"
          th:object="${choreographyRequest}" method="post" class="card p-8 space-y-8">

        <!-- CSRF Token (Automatically handled by Thymeleaf, but good to ensure) -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Error Summary -->
        <div th:replace="~{fragments/form :: errorSummary}"></div>

        <div class="space-y-6">
            <!-- Name -->
            <div th:replace="~{fragments/form :: field(path='name', label='Choreography Name', required=true, placeholder='e.g. Bronze Waltz Routine')}"></div>

            <!-- Description -->
            <div th:replace="~{fragments/form :: richText(path='description', label='Description / Notes', placeholder='Add details, target level, or practice focus...', rows=4)}"></div>

            <!-- Dance Style -->
            <div th:if="${choreographyId != null}">
                <input type="hidden" name="danceTypeId" th:value="*{danceTypeId}">
                <div th:replace="~{fragments/form :: select(path='danceTypeId', label='Dance Style', required=true, options=${danceTypes}, optValue='id', optLabel='name', placeholder='Select a dance style...', disabled=true, hint='Dance style cannot be changed after choreography has been created.')}"></div>
            </div>
            <div th:if="${choreographyId == null}">
                <div th:replace="~{fragments/form :: select(path='danceTypeId', label='Dance Style', required=true, options=${danceTypes}, optValue='id', optLabel='name', placeholder='Select a dance style...')}"></div>
            </div>
        </div>

        <hr class="border-outline-variant/30">

        <!-- Visibility Toggle -->
        <div th:replace="~{fragments/form :: toggle(path='isPublic', label='Public Choreography', hint='Visible and cloneable by other dancers')}"></div>

        <div th:replace="~{fragments/button :: submitRow(cancelHref=${choreographyId == null ? '/choreographies' : '/choreographies/' + choreographyId + '/edit'}, submitLabel='Save Details', submitIcon='save')}"></div>
    </form>

    <script src="https://unpkg.com/trix@2.1.19/dist/trix.umd.min.js"></script>
</section>
</html>
