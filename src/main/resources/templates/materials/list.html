<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="activeNav='materials'" class="space-y-lg relative">

    <!-- Page Header -->
    <div th:replace="~{fragments/page :: pageHeader(title='Movements Library', subtitle=${#lists.size(materials)} + ' movements registered', actionUrl='/materials/new', actionText='Add Movement', actionIcon='add', actionVariant='primary')}"></div>

    <!-- Sticky Search & Filter Section -->
    <section class="sticky top-[72px] bg-background z-40 -mx-6 px-6 pt-4 pb-4 border-b border-outline-variant/30 transition-all duration-300">
        <form id="filterForm" th:hx-get="@{/materials}" hx-target="#materials-grid" hx-swap="outerHTML" hx-trigger="submit, change from:input[type='checkbox'], change from:input[type='radio'], change from:select" hx-push-url="false">
            <!-- Top Row: Search + Filter Toggle + View Toggle -->
            <div class="flex items-center gap-3">
                <div class="relative flex-1 group">
                    <span th:replace="~{fragments/icon :: icon(name='search', size='md', cls='absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors')}"></span>
                    <input type="text" name="nameSearch" th:value="${selectedNameSearch}"
                           class="w-full bg-surface-container border border-transparent focus:ring-0 focus:border-primary-container rounded-lg py-2 pl-[38px] pr-3 text-body-md text-on-surface placeholder:text-on-surface-variant transition-colors outline-hidden"
                           placeholder="Search..."
                           hx-trigger="keyup changed delay:300ms" th:hx-get="@{/materials}" hx-target="#materials-grid" hx-swap="outerHTML" hx-include="#filterForm">
                </div>

                <!-- Filter Toggle -->
                <button type="button" class="js-filter-toggle flex items-center gap-2 px-3 py-2 rounded-lg border border-outline-variant/30 text-on-surface-variant hover:bg-surface-variant transition-colors h-[42px]">
                    <span th:replace="~{fragments/icon :: icon(name='tune', size='md', cls='pointer-events-none')}"></span>
                    <span class="hidden sm:inline text-label-sm font-label-sm pointer-events-none">Filters</span>
                </button>

                <!-- View Toggle -->
                <div class="flex bg-surface-container p-1 rounded-lg border border-outline-variant/30 h-[42px] items-center">
                    <label class="cursor-pointer">
                        <input type="radio" name="view" value="list" class="hidden peer"
                               aria-label="List view"
                               th:checked="${currentView == 'list' || currentView == null}"
                               th:hx-get="@{/materials}" hx-target="#materials-grid" hx-swap="outerHTML" hx-include="#filterForm">
                        <div class="px-2.5 py-1 rounded-md flex items-center gap-1.5 text-label-sm font-label-sm transition-all peer-checked:bg-white peer-checked:text-primary peer-checked:shadow-xs text-on-surface-variant hover:text-on-surface">
                            <span th:replace="~{fragments/icon :: icon(name='view_list', size='sm')}"></span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="view" value="grid" class="hidden peer"
                               aria-label="Grid view"
                               th:checked="${currentView == 'grid'}"
                               th:hx-get="@{/materials}" hx-target="#materials-grid" hx-swap="outerHTML" hx-include="#filterForm">
                        <div class="px-2.5 py-1 rounded-md flex items-center gap-1.5 text-label-sm font-label-sm transition-all peer-checked:bg-white peer-checked:text-primary peer-checked:shadow-xs text-on-surface-variant hover:text-on-surface">
                            <span th:replace="~{fragments/icon :: icon(name='grid_view', size='sm')}"></span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Bottom Row: Collapsible Filters Container -->
            <div id="categoryFiltersContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6 transition-all duration-300 max-h-0 opacity-0 pointer-events-none mt-0 overflow-hidden">
                <!-- Column 1: Categories -->
                <div class="flex flex-col gap-4 mt-4">
                    <!-- Categories -->
                    <div class="flex flex-col gap-2">
                        <span class="text-label-sm font-label-sm text-outline uppercase tracking-wider">Categories</span>
                        <div class="flex flex-wrap gap-2">
                            <label th:each="c : ${danceCategories}" class="cursor-pointer">
                                <input type="checkbox" name="categoryIds" th:value="${c.id}" class="js-category-checkbox hidden peer"
                                       th:checked="${selectedCategoryIds != null && #lists.contains(selectedCategoryIds, c.id)}"
                                       th:hx-get="@{/materials}" hx-target="#materials-grid" hx-swap="outerHTML" hx-include="#filterForm">
                                <span class="px-3 py-1.5 rounded-full inline-flex items-center gap-1.5 text-label-sm font-label-sm transition-all peer-checked:bg-primary-container peer-checked:text-on-primary-container bg-surface-container text-on-surface hover:bg-surface-container-high border border-outline-variant/30">
                                    <span th:replace="~{fragments/icon :: icon(name='check', size='sm', cls='hidden peer-checked:inline')}"></span>
                                    <span th:text="${c.name}">Category</span>
                                </span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Column 2: Styles (Dance Types) & Rating -->
                <div class="flex flex-col gap-4 mt-4 md:col-span-1">
                    <!-- Dance Styles -->
                    <div class="flex flex-col gap-2">
                        <span class="text-label-sm font-label-sm text-outline uppercase tracking-wider">Dance Styles</span>
                        <div class="flex flex-wrap gap-2 max-h-[160px] overflow-y-auto pr-2 scrollbar-thin">
                            <label th:each="t : ${danceTypes}" 
                                   th:data-category-id="${t.category != null ? t.category.id : ''}"
                                   class="js-style-pill cursor-pointer transition-all duration-300">
                                <input type="checkbox" name="typeIds" th:value="${t.id}" class="js-style-checkbox hidden peer"
                                       th:checked="${selectedTypeIds != null && #lists.contains(selectedTypeIds, t.id)}"
                                       th:hx-get="@{/materials}" hx-target="#materials-grid" hx-swap="outerHTML" hx-include="#filterForm">
                                <span class="px-3 py-1.5 rounded-full inline-flex items-center gap-1.5 text-label-sm font-label-sm transition-all peer-checked:bg-primary-container peer-checked:text-on-primary-container bg-surface-container text-on-surface hover:bg-surface-container-high border border-outline-variant/30">
                                    <span th:replace="~{fragments/icon :: icon(name='check', size='sm', cls='hidden peer-checked:inline')}"></span>
                                    <span th:text="${t.name}">Style</span>
                                </span>
                            </label>
                        </div>
                    </div>

                    <!-- Rating -->
                    <div class="flex flex-col gap-1">
                        <label for="filterRating" class="text-label-sm font-label-sm text-outline uppercase tracking-wider">Minimum Rating</label>
                        <select name="minRating" id="filterRating" 
                                class="px-4 py-2 rounded-lg bg-surface border border-outline-variant/30 text-on-surface font-body-md focus:border-primary focus:outline-hidden w-full"
                                th:hx-get="@{/materials}" hx-target="#materials-grid" hx-swap="outerHTML" hx-include="#filterForm">
                            <option value="" th:selected="${selectedMinRating == null}">Any Rating</option>
                            <option value="5" th:selected="${selectedMinRating == 5}">★★★★★ (5 Stars)</option>
                            <option value="4" th:selected="${selectedMinRating == 4}">★★★★☆ (4+ Stars)</option>
                            <option value="3" th:selected="${selectedMinRating == 3}">★★★☆☆ (3+ Stars)</option>
                            <option value="2" th:selected="${selectedMinRating == 2}">★★☆☆☆ (2+ Stars)</option>
                            <option value="1" th:selected="${selectedMinRating == 1}">★☆☆☆☆ (1+ Star)</option>
                        </select>
                    </div>
                </div>

                <!-- Column 3: Sorting -->
                <div class="flex flex-col gap-1 mt-4">
                    <label for="filterSort" class="text-label-sm font-label-sm text-outline uppercase tracking-wider">Sort By</label>
                    <select name="sort" id="filterSort" 
                            class="px-4 py-2 rounded-lg bg-surface border border-outline-variant/30 text-on-surface font-body-md focus:border-primary focus:outline-hidden w-full"
                            th:hx-get="@{/materials}" hx-target="#materials-grid" hx-swap="outerHTML" hx-include="#filterForm">
                        <option value="createdAt,desc" th:selected="${currentSort == 'createdAt,desc'}">Newest First</option>
                        <option value="createdAt,asc" th:selected="${currentSort == 'createdAt,asc'}">Oldest First</option>
                        <option value="name,asc" th:selected="${currentSort == 'name,asc'}">Name (A-Z)</option>
                        <option value="name,desc" th:selected="${currentSort == 'name,desc'}">Name (Z-A)</option>
                        <option value="rating,desc" th:selected="${currentSort == 'rating,desc'}">Rating (High to Low)</option>
                        <option value="rating,asc" th:selected="${currentSort == 'rating,asc'}">Rating (Low to High)</option>
                        <option value="danceType.name,asc" th:selected="${currentSort == 'danceType.name,asc'}">Style (A-Z)</option>
                        <option value="danceType.name,desc" th:selected="${currentSort == 'danceType.name,desc'}">Style (Z-A)</option>
                        <option value="updatedAt,desc" th:selected="${currentSort == 'updatedAt,desc'}">Recently Updated</option>
                    </select>
                </div>
            </div>
        </form>
    </section>

    <!-- Materials Grid (HTMX swappable) -->
    <div th:fragment="materialsTable" id="materials-grid" class="space-y-gutter">
        <div th:if="${#lists.isEmpty(materials)}" class="empty-state">
            <div class="empty-state-icon">
                <span th:replace="~{fragments/icon :: icon(name='search_off', size='lg', cls='text-outline')}"></span>
            </div>
            <h3 class="empty-state-title">No movements found</h3>
            <p class="empty-state-text">Your library is quiet. Adjust your filters or add a new material to begin.</p>
            <a href="/materials/new" class="btn-primary">Import first material</a>
        </div>

        <!-- 1. Grid View -->
        <div th:if="${!#lists.isEmpty(materials) && currentView == 'grid'}" class="grid grid-cols-1 sm:grid-cols-2 gap-6 md:gap-8">
            <article th:each="m : ${materials}"
                     th:with="catName=${m.danceType != null && m.danceType.category != null ? m.danceType.category.name : 'Unknown'},
                              catImage=${m.danceType != null && m.danceType.category != null ? m.danceType.category.imageFilename : null},
                              imgSrc=${catImage != null ? '/uploads/categories/' + catImage : '/uploads/defaults/category-placeholder.png'}"
                     class="card relative group flex flex-col hover:z-30 focus-within:z-30">
                
                <a th:href="@{/materials/{id}(id=${m.id})}" class="absolute inset-0 z-0 rounded-lg"><span class="sr-only" th:text="'View ' + ${m.name}">View Material</span></a>
                
                <!-- Absolute Action Menu (Fixed Stacking) -->
                <div class="absolute top-3 right-2 z-30 group/menu pointer-events-auto">
                    <button type="button" class="js-menu-btn w-11 h-11 rounded-full hover:bg-surface-variant flex items-center justify-center text-on-surface-variant transition-colors" aria-label="More actions">
                        <span th:replace="~{fragments/icon :: icon(name='more_vert', size='md', cls='pointer-events-none')}"></span>
                    </button>
                    <div class="js-menu-dropdown absolute right-0 top-full w-36 bg-surface rounded-lg shadow-lg border border-outline-variant py-1 hidden z-50">
                        <a th:href="@{/materials/{id}(id=${m.id})}" class="flex items-center gap-2 px-4 py-2 text-body-md text-on-surface hover:bg-surface-variant transition-colors">
                            <span th:replace="~{fragments/icon :: icon(name='open_in_new', size='sm')}"></span> Open
                        </a>
                        <th:block th:if="${currentUser != null and (currentUser.role.name() == 'ADMIN' or m.owner?.id == currentUser.id)}">
                            <a th:href="@{/materials/{id}/edit(id=${m.id})}" class="flex items-center gap-2 px-4 py-2 text-body-md text-on-surface hover:bg-surface-variant transition-colors">
                                <span th:replace="~{fragments/icon :: icon(name='edit', size='sm')}"></span> Edit
                            </a>
                        </th:block>
                        <a th:href="${m.sourceLink != null && !m.sourceLink.isEmpty()} ? ${m.sourceLink} : @{/materials/{id}(id=${m.id})}" 
                           th:target="${m.sourceLink != null && !m.sourceLink.isEmpty()} ? '_blank' : '_self'" 
                           class="flex items-center gap-2 px-4 py-2 text-body-md text-on-surface hover:bg-surface-variant transition-colors">
                            <span th:replace="~{fragments/icon :: icon(name='smart_display', size='sm')}"></span> Watch
                        </a>
                    </div>
                </div>

                <div class="flex flex-row w-full relative z-0 pointer-events-none">
                    <div class="w-1/3 aspect-square relative overflow-hidden rounded-tl-lg bg-surface-container-high block z-0">
                        <img th:src="${imgSrc}" th:alt="${catName}" class="w-full h-full object-cover grayscale opacity-90 group-hover:grayscale-0 transition-all duration-500" />
                        <div class="absolute inset-0 bg-black/10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                            <span th:replace="~{fragments/icon :: icon(name='play_arrow', size='lg', cls='text-white')}"></span>
                        </div>
                    </div>
                    <div class="w-2/3 p-4 flex flex-col justify-between relative z-10 bg-surface rounded-tr-lg">
                        <div>
                            <div class="flex items-start justify-between mb-2">
                                <h3 class="text-body-md font-semibold text-on-surface group-hover:text-primary transition-colors whitespace-normal pr-8 flex-1" th:text="${m.name}">Material Name</h3>
                            </div>
                            
                            <div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 relative z-20 pointer-events-auto">
                                <th:block th:if="${!m.isPublic}">
                                    <span th:replace="~{fragments/badge :: badge(label='Private', variant='neutral')}"></span>
                                </th:block>
                                <span th:text="${m.danceType != null ? m.danceType.name : 'Uncategorized'}" class="bg-primary-container/20 text-on-surface px-2.5 py-0.5 rounded-full text-[10px] font-label-sm uppercase tracking-wider whitespace-nowrap shrink-0 border border-primary-container/30">Style</span>
                                <span class="flex items-center gap-1 text-label-sm text-on-surface-variant whitespace-nowrap shrink-0"><span th:replace="~{fragments/icon :: icon(name='calendar_today', size='sm')}"></span> <span th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy')}">Date</span></span>
                                <span class="flex items-center gap-1 text-label-sm text-on-surface-variant whitespace-nowrap shrink-0"><span th:replace="~{fragments/icon :: icon(name='schema', size='sm')}"></span> <span th:text="${#lists.size(m.figures)}">0</span></span>
                                <span th:if="${m.rating != null}" class="flex items-center gap-0.5 text-label-sm text-amber-500 font-semibold whitespace-nowrap shrink-0">
                                    <span th:replace="~{fragments/icon :: icon(name='star', size='sm', filled=true)}"></span>
                                    <span th:text="${m.rating}">5</span>
                                </span>
                            </div>
                        </div>
                        <div th:if="${m.description}" class="mt-auto pt-3 relative z-20 pointer-events-auto">
                             <button type="button" class="js-expand-btn text-primary flex items-center gap-1 text-sm font-label-md transition-colors hover:text-primary-container focus:outline-hidden">
                                 <span class="pointer-events-none">View description</span>
                                 <span th:replace="~{fragments/icon :: icon(name='expand_more', size='sm', cls='transition-transform duration-300 icon-expand pointer-events-none')}"></span>
                             </button>
                        </div>
                    </div>
                </div>
                
                <div th:if="${m.description}" class="expandable-content max-h-0 overflow-hidden transition-all duration-300 ease-in-out w-full relative z-20 pointer-events-none rounded-b-lg">
                     <div class="px-4 pb-4 pt-1 border-t border-outline-variant/30 mt-2 mx-4 pointer-events-auto bg-surface">
                          <div th:replace="~{fragments/rich-text :: content(value=${m.description}, cls='font-body-md text-sm text-on-surface-variant mt-3 leading-relaxed relative z-20')}"></div>
                     </div>
                </div>
            </article>
        </div>

        <!-- 2. Compact List View -->
        <div th:if="${!#lists.isEmpty(materials) && (currentView == 'list' || currentView == null)}" class="flex flex-col gap-3">
            <article th:each="m : ${materials}"
                     class="card relative group flex items-center justify-between p-3 hover:z-30 focus-within:z-30">
                
                <a th:href="@{/materials/{id}(id=${m.id})}" class="absolute inset-0 z-0 rounded-lg"><span class="sr-only" th:text="'View ' + ${m.name}">View Material</span></a>
                
                <div class="flex flex-col gap-1.5 pointer-events-none relative z-10 w-full pr-12 overflow-hidden">
                    <div class="flex items-center gap-2">
                        <h3 class="text-body-md font-semibold text-on-surface flex-1" th:text="${m.name}">Material Name</h3>
                    </div>
                    <div class="flex items-center gap-3 text-on-surface-variant">
                        <th:block th:if="${!m.isPublic}">
                            <span th:replace="~{fragments/badge :: badge(label='Private', variant='neutral')}"></span>
                        </th:block>
                        <span th:text="${m.danceType != null ? m.danceType.name : 'Uncategorized'}" class="bg-primary-container/20 text-on-surface px-2.5 py-0.5 rounded-full text-[10px] font-label-sm uppercase tracking-wider whitespace-nowrap shrink-0 pointer-events-auto border border-primary-container/30">Style</span>
                        <span class="flex items-center gap-1 text-label-sm"><span th:replace="~{fragments/icon :: icon(name='schema', size='sm')}"></span> <span th:text="${#lists.size(m.figures)}">0</span></span>
                        <span th:if="${m.rating != null}" class="flex items-center gap-0.5 text-label-sm text-amber-500 font-semibold shrink-0">
                            <span th:replace="~{fragments/icon :: icon(name='star', size='sm', filled=true)}"></span>
                            <span th:text="${m.rating}">5</span>
                        </span>
                    </div>
                </div>

                <div class="flex flex-col items-end gap-1 relative z-20 pointer-events-auto">
                    <span class="flex items-center gap-1 text-label-sm text-on-surface-variant whitespace-nowrap shrink-0"><span th:replace="~{fragments/icon :: icon(name='calendar_today', size='sm')}"></span> <span th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy')}">Date</span></span>
                    <div class="group/menu">
                        <button type="button" class="js-menu-btn w-11 h-11 rounded-full hover:bg-surface-variant flex items-center justify-center text-on-surface-variant transition-colors" aria-label="More actions">
                            <span th:replace="~{fragments/icon :: icon(name='more_vert', size='md', cls='pointer-events-none')}"></span>
                        </button>
                        <div class="js-menu-dropdown absolute right-0 top-full w-36 bg-surface rounded-lg shadow-lg border border-outline-variant py-1 hidden z-50">
                            <a th:href="@{/materials/{id}(id=${m.id})}" class="flex items-center gap-2 px-4 py-2 text-body-md text-on-surface hover:bg-surface-variant transition-colors">
                                <span th:replace="~{fragments/icon :: icon(name='open_in_new', size='sm')}"></span> Open
                            </a>
                            <th:block th:if="${currentUser != null and (currentUser.role.name() == 'ADMIN' or m.owner?.id == currentUser.id)}">
                                <a th:href="@{/materials/{id}/edit(id=${m.id})}" class="flex items-center gap-2 px-4 py-2 text-body-md text-on-surface hover:bg-surface-variant transition-colors">
                                    <span th:replace="~{fragments/icon :: icon(name='edit', size='sm')}"></span> Edit
                                </a>
                            </th:block>
                            <a th:href="${m.sourceLink != null && !m.sourceLink.isEmpty()} ? ${m.sourceLink} : @{/materials/{id}(id=${m.id})}" 
                               th:target="${m.sourceLink != null && !m.sourceLink.isEmpty()} ? '_blank' : '_self'" 
                               class="flex items-center gap-2 px-4 py-2 text-body-md text-on-surface hover:bg-surface-variant transition-colors">
                                <span th:replace="~{fragments/icon :: icon(name='smart_display', size='sm')}"></span> Watch
                            </a>
                        </div>
                    </div>
                </div>
            </article>
        </div>
    </div>

</section>
</html>
