<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="activeNav='choreographies'" class="max-w-3xl mx-auto py-12">

    <div th:replace="~{fragments/page :: pageHeader(title=(${choreographyId == null ? #messages.msg('choreographies.form.title.new') : #messages.msg('choreographies.form.title.edit')}), subtitle=#{choreographies.form.subtitle})}"></div>

    <form th:action="@{${choreographyId == null ? '/choreographies' : '/choreographies/' + choreographyId + '/metadata'}}"
          th:object="${choreographyRequest}" method="post" class="card p-8 space-y-8">

        <!-- CSRF Token (Automatically handled by Thymeleaf, but good to ensure) -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Error Summary -->
        <div th:replace="~{fragments/form :: errorSummary}"></div>

        <div class="space-y-6">
            <!-- Name -->
            <div th:replace="~{fragments/form :: field(path='name', label=#{choreographies.form.name_label}, required=true, placeholder=#{choreographies.form.name_placeholder})}"></div>

            <!-- Description -->
            <div th:replace="~{fragments/form :: richText(path='description', label=#{choreographies.form.description_label}, placeholder=#{choreographies.form.description_placeholder}, rows=4)}"></div>

            <!-- Dance Style -->
            <div th:if="${choreographyId != null}">
                <input type="hidden" name="danceTypeId" th:value="*{danceTypeId}">
                <div th:replace="~{fragments/form :: selectField(path='danceTypeId', label=#{choreographies.form.dance_style_label}, required=true, options=${danceTypes}, optValue='id', optLabel='name', placeholder=#{choreographies.form.select_dance_style}, disabled=true, hint=#{choreographies.form.dance_style_disabled_hint})}"></div>
            </div>
            <div th:if="${choreographyId == null}">
                <div th:replace="~{fragments/form :: selectField(path='danceTypeId', label=#{choreographies.form.dance_style_label}, required=true, options=${danceTypes}, optValue='id', optLabel='name', placeholder=#{choreographies.form.select_dance_style})}"></div>
            </div>

            <!-- Medal Level (optional, set by hand) -->
            <div class="form-group">
                <label class="form-label" id="medalLevelLabel">
                    <span th:text="#{choreographies.form.medal_label}">Medal Level (Optional)</span>
                </label>
                <div class="flex flex-wrap items-center gap-2 pt-1" role="radiogroup" aria-labelledby="medalLevelLabel">
                    <label class="relative inline-flex items-center gap-2 min-h-[44px] px-4 py-2 rounded-full border border-outline bg-surface font-semibold text-sm cursor-pointer hover:bg-surface-container has-[:checked]:border-primary has-[:checked]:ring-1 has-[:checked]:ring-primary">
                        <input type="radio" name="medalLevel" value=""
                               th:checked="${choreographyRequest.medalLevel == null}"
                               class="sr-only">
                        <span th:text="#{figures.medal.none}">None</span>
                    </label>
                    <label th:each="lvl : ${medalLevels ?: T(com.jankowski.rafal.dancebook.model.MedalLevel).values()}"
                           class="relative inline-flex items-center gap-2 min-h-[44px] px-4 py-2 rounded-full border border-outline bg-surface font-semibold text-sm cursor-pointer hover:bg-surface-container has-[:checked]:border-primary has-[:checked]:ring-1 has-[:checked]:ring-primary">
                        <input type="radio" name="medalLevel" th:value="${lvl.name()}"
                               th:checked="${choreographyRequest.medalLevel == lvl}"
                               class="sr-only">
                        <th:block th:replace="~{fragments/badge :: medalBadge(level=${lvl}, word=true)}"></th:block>
                    </label>
                </div>
            </div>
        </div>

        <hr class="border-outline-variant/30">

        <!-- Visibility Toggle -->
        <div th:replace="~{fragments/form :: toggle(path='isPublic', label=#{choreographies.form.is_public_label}, hint=#{choreographies.form.is_public_hint})}"></div>

        <div th:replace="~{fragments/button :: submitRow(cancelHref=${choreographyId == null ? '/choreographies' : '/choreographies/' + choreographyId + '/edit'}, cancelLabel=#{common.cancel}, submitLabel=#{choreographies.form.save_details}, submitIcon='save')}"></div>
    </form>

    <script src="https://unpkg.com/trix@2.1.19/dist/trix.umd.min.js"></script>
</section>
</html>
