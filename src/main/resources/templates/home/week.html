<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Monday to Sunday of the current week. `oob` is set only by the attendance response, which
     refreshes this strip alongside the wrap-up section because the answer changes it. -->
<section th:fragment="homeWeek"
         id="home-week"
         aria-label="This week"
         th:attr="aria-label=#{dashboard.week.aria_label}, hx-swap-oob=${oob != null ? 'true' : null}"
         class="card rounded-2xl px-2 py-3 lg:px-4 flex flex-col gap-3">
    <ol class="grid grid-cols-7 gap-1 list-none m-0 p-0">
        <li th:each="day : ${dashboard.week.days}" class="flex flex-col lg:flex-row items-center lg:justify-center gap-1.5 lg:gap-2">
            <span class="text-[11px] lg:text-xs text-on-surface-variant"
                  th:classappend="${day.today ? 'font-bold text-on-surface' : ''}"
                  th:text="${day.weekdayLabel}">Mon</span>
            <span class="flex items-center justify-center w-8 h-8 rounded-full text-xs font-semibold"
                  th:classappend="${(day.state.name() == 'ATTENDED' ? 'bg-primary text-on-primary' :
                                    (day.state.name() == 'UNCONFIRMED' ? 'border border-dashed border-warning bg-warning/10 text-warning' :
                                    (day.state.name() == 'PLANNED' ? 'border border-primary text-primary' : 'text-on-surface-variant'))) +
                                    (day.today ? ' ring-2 ring-on-surface ring-offset-2 font-bold' : '')}"
                  th:attr="aria-label=${day.weekdayLabel + ' ' + day.dayOfMonth + (day.state.name() == 'ATTENDED' ? #messages.msg('dashboard.week.state.attended') :
                                        (day.state.name() == 'UNCONFIRMED' ? #messages.msg('dashboard.week.state.needs_confirmation') :
                                        (day.state.name() == 'PLANNED' ? #messages.msg('dashboard.week.state.planned') : ''))) + (day.today ? #messages.msg('dashboard.week.today') : '')}"
                  th:text="${day.dayOfMonth}">22</span>
        </li>
    </ol>
    <p class="flex items-center gap-1.5 px-2 text-xs m-0">
        <th:block th:if="${dashboard.week.streak > 0}">
            <span class="flex items-center gap-1.5 font-semibold text-primary">
                <span th:replace="~{fragments/icon :: icon(name='local_fire_department', size='sm')}"></span>
                <span th:text="#{dashboard.week.streak(${dashboard.week.streak})}">4-session streak</span>
            </span>
        </th:block>
        <span th:if="${dashboard.week.toConfirmCount > 0}"
              class="ml-auto font-medium text-warning"
              th:text="#{dashboard.week.to_confirm(${dashboard.week.toConfirmCount})}">2 to confirm</span>
    </p>
</section>

</body>
</html>
