<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="activeNav='training-events'" class="space-y-lg">

    <div th:replace="~{fragments/page :: pageHeader(title=#{nav.training}, subtitle=${stats.period.label}, toolbar=~{::statsToolbar})}">
        <div th:fragment="statsToolbar" class="flex flex-wrap items-center gap-4 max-w-full">
            <div th:replace="~{fragments/calendar-selector :: calendarSelector}"></div>
            <nav th:replace="~{fragments/page :: viewSwitcher(currentView='stats')}"></nav>
        </div>
    </div>

    <th:block th:if="${selectableCalendars == null || selectableCalendars.isEmpty()}">
        <div th:replace="~{fragments/empty :: emptyState(
            icon='calendar_month',
            title=#{training.empty.no_calendars_title},
            text=#{training.empty.no_calendars_text},
            actionHref='/training-calendars/new',
            actionLabel=#{training.empty.no_calendars_action})}"></div>
    </th:block>

    <th:block th:unless="${selectableCalendars == null || selectableCalendars.isEmpty()}">
    <!-- Period selector. Plain links, so the charts initialise once per page load
         instead of having to be destroyed and rebuilt on an HTMX swap. -->
    <div class="chip-group">
        <a th:each="option : ${periods}"
           th:href="@{/training-events/stats(period=${option})}"
           class="chip"
           th:classappend="${option == stats.period} ? 'chip-active' : ''"
           th:attr="aria-current=${option == stats.period} ? 'page' : null"
           th:text="${option.label}">All time</a>
    </div>

    <!-- Empty state: no sessions to summarise. -->
    <th:block th:if="${stats.counts.total == 0}">
        <div th:replace="~{fragments/empty :: emptyState(
            icon='monitoring',
            title=(${stats.period.name() == 'ALL_TIME'} ? #{training.stats.empty_all_title} : #{training.stats.empty_period_title}),
            text=(${stats.period.name() == 'ALL_TIME'}
                ? #{training.stats.empty_all_text}
                : #{training.stats.empty_period_text}),
            actionHref=(${canAddSession} ? '/training-events/new' : null),
            actionLabel=#{training.add_session})}"></div>
    </th:block>

    <div th:if="${stats.counts.total > 0}" class="space-y-lg">

        <!-- KPI cards. Two up on a phone, four across from md. -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-gutter">
            <div th:replace="~{fragments/card :: statCard(value=${stats.totalTrainedLabel}, label=#{training.stats.hours_trained})}"></div>
            <div th:replace="~{fragments/card :: statCard(value=(${stats.attendanceRatePercent != null ? stats.attendanceRatePercent + '%' : '—'}), label=#{training.stats.attendance})}"></div>
            <div th:replace="~{fragments/card :: statCard(value=${stats.currentStreak}, label=#{training.stats.streak}, caption=#{training.stats.streak_caption})}"></div>
            <div th:replace="~{fragments/card :: statCard(value=${stats.counts.attended}, label=#{training.stats.attended}, caption=#{training.stats.attended_caption(${stats.counts.skipped}, ${stats.counts.upcoming})})}"></div>
        </div>

        <!-- Nudge. Unconfirmed sessions are excluded from every figure above, so the way
             to make these numbers truer is to go and confirm them. -->
        <a th:if="${stats.counts.unconfirmed > 0}"
           th:href="@{/training-events(awaitingConfirmation=true)}"
           class="card p-4 flex items-center gap-4 hover:border-outline transition-colors">
            <span th:replace="~{fragments/icon :: icon(name='help', size='md', cls='text-secondary')}"></span>
            <div>
                <p class="font-semibold text-text-primary"
                   th:text="#{training.stats.unconfirmed_title(${stats.counts.unconfirmed})}">
                    3 past sessions need confirming</p>
                <p class="text-sm text-text-secondary" th:text="#{training.stats.unconfirmed_text}">They count towards nothing above until
                    you mark them attended or skipped.</p>
            </div>
        </a>

        <!-- Charts. Each canvas carries its own slices; training-stats.js reads them and
             owns no data or colours of its own. The list beneath is the legend, the
             accessible form of the chart, and what you see when JavaScript does not run. -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-gutter">

            <div class="card p-6 space-y-4">
                <h2 class="text-lg font-heading font-medium text-text-primary" th:text="#{training.stats.time_by_style}">Time by style</h2>
                <div th:if="${!#lists.isEmpty(stats.byCategory)}" class="relative h-64">
                    <canvas id="category-chart" aria-hidden="true" th:attr="data-slices=${categoryChartJson}"></canvas>
                </div>
                <ul class="space-y-2">
                    <li th:each="slice : ${stats.byCategory}" class="flex items-center gap-3 text-sm">
                        <span class="w-3 h-3 rounded-full shrink-0" th:style="'background-color:' + ${slice.color}"></span>
                        <span class="text-text-primary flex-1" th:text="${slice.label}">Standard</span>
                        <span class="text-text-secondary" th:text="${slice.durationLabel}">6h</span>
                    </li>
                </ul>
                <p th:if="${#lists.isEmpty(stats.byCategory)}" class="text-sm text-text-secondary" th:text="#{training.stats.no_attended}">
                    No attended sessions in this period yet</p>
            </div>

            <div class="card p-6 space-y-4">
                <h2 class="text-lg font-heading font-medium text-text-primary" th:text="#{training.stats.time_by_type}">Time by session type</h2>
                <div th:if="${!#lists.isEmpty(stats.byEventType)}" class="relative h-64">
                    <canvas id="event-type-chart" aria-hidden="true" th:attr="data-slices=${eventTypeChartJson}, data-grid-color=${chartGridColor}"></canvas>
                </div>
                <ul class="space-y-2">
                    <li th:each="slice : ${stats.byEventType}" class="flex items-center gap-3 text-sm">
                        <span class="w-3 h-3 rounded-full shrink-0" th:style="'background-color:' + ${slice.color}"></span>
                        <span class="text-text-primary flex-1" th:text="${slice.label}">TRAINING</span>
                        <span class="text-text-secondary"
                              th:text="#{training.stats.slice_sessions(${slice.durationLabel}, ${slice.sessionCount})}">6h · 4 sessions</span>
                    </li>
                </ul>
                <p th:if="${#lists.isEmpty(stats.byEventType)}" class="text-sm text-text-secondary" th:text="#{training.stats.no_attended}">
                    No attended sessions in this period yet</p>
            </div>
        </div>
    </div>
    </th:block>

    <!-- Chart.js comes from unpkg because script-src allows that origin and nothing else
         external; a jsdelivr or cdnjs URL would be blocked with no visible error. -->
    <script src="https://unpkg.com/chart.js@4.5.0/dist/chart.umd.js"></script>
    <script th:src="@{/js/training-stats.js}"></script>
</section>
</html>
