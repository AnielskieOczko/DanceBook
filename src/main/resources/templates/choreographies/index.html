<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="activeNav='choreographies'" class="space-y-lg relative">

    <!-- Page Header -->
    <div th:replace="~{fragments/page :: header(title='Choreographies', subtitle=${#lists.size(choreographies)} + ' choreography routines created', actionUrl='/choreographies/new', actionText='New Choreography', actionIcon='add', actionVariant='primary')}"></div>

    <!-- View Toggles and Filter Summary -->
    <section class="bg-background z-40 py-2 border-b border-outline-variant/30 transition-all duration-300">
        <div class="flex items-center justify-between gap-3">
            <div class="text-label-sm font-label-sm text-outline uppercase tracking-wider">
                My Routines
            </div>

            <!-- View Toggle -->
            <form id="viewToggleForm" th:hx-get="@{/choreographies}" hx-target="#choreographies-list" hx-swap="outerHTML" hx-trigger="change from:input[type='radio']" hx-push-url="false">
                <div class="flex bg-surface-container p-1 rounded-lg border border-outline-variant/30 h-[42px] items-center">
                    <label class="cursor-pointer">
                        <input type="radio" name="view" value="list" class="hidden peer"
                               aria-label="List view"
                               th:checked="${currentView == 'list' || currentView == null}">
                        <div class="px-2.5 py-1 rounded-md flex items-center gap-1.5 text-label-sm font-label-sm transition-all peer-checked:bg-white peer-checked:text-primary peer-checked:shadow-xs text-on-surface-variant hover:text-on-surface">
                            <span th:replace="~{fragments/icon :: icon(name='view_list', size='sm')}"></span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="view" value="grid" class="hidden peer"
                               aria-label="Grid view"
                               th:checked="${currentView == 'grid'}">
                        <div class="px-2.5 py-1 rounded-md flex items-center gap-1.5 text-label-sm font-label-sm transition-all peer-checked:bg-white peer-checked:text-primary peer-checked:shadow-xs text-on-surface-variant hover:text-on-surface">
                            <span th:replace="~{fragments/icon :: icon(name='grid_view', size='sm')}"></span>
                        </div>
                    </label>
                </div>
            </form>
        </div>
    </section>

    <!-- Choreographies List / Grid (HTMX Swappable) -->
    <div th:fragment="choreographyList" id="choreographies-list" class="space-y-gutter">
        
        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(choreographies)}" class="empty-state">
            <div class="empty-state-icon">
                <span th:replace="~{fragments/icon :: icon(name='route', size='lg', cls='text-outline')}"></span>
            </div>
            <h3 class="empty-state-title">No choreographies yet</h3>
            <p class="empty-state-text">Create your first dance choreography routine by chaining figures together!</p>
            <a href="/choreographies/new" class="btn-primary mt-4">Create Choreography</a>
        </div>

        <!-- 1. Grid (Cards) View -->
        <div th:if="${!#lists.isEmpty(choreographies) && currentView == 'grid'}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="choreo : ${choreographies}"
                 class="card relative group flex flex-col justify-between p-5 hover:z-30 focus-within:z-30 min-h-[180px]">
                
                <!-- Main Link -->
                <a th:href="@{/choreographies/{id}(id=${choreo.id})}" class="absolute inset-0 z-0 rounded-lg"><span class="sr-only">View</span></a>

                <div class="relative z-10 pointer-events-none w-full flex-1 flex flex-col justify-between">
                    <div>
                        <div class="flex flex-wrap items-center gap-2 mb-2 pr-8">
                            <span class="bg-primary-container/20 text-on-surface px-2.5 py-0.5 rounded-full text-[10px] font-label-sm uppercase tracking-wider border border-primary-container/30"
                                  th:text="${choreo.danceType != null ? choreo.danceType.name : 'Unknown Dance'}">Waltz</span>
                            <span th:if="${choreo.isPublic}" class="badge bg-success-soft text-success text-[10px]">Public</span>
                            <span th:unless="${choreo.isPublic}" class="badge bg-surface-warm text-text-secondary text-[10px]">Private</span>
                        </div>

                        <h3 class="text-lg font-bold text-on-surface group-hover:text-primary transition-colors line-clamp-1 mb-1 pr-8" th:text="${choreo.name}">Competition Waltz</h3>
                        <p th:replace="~{fragments/rich-text :: excerpt(value=${choreo.description}, max=160, fallback='No description provided.', cls='text-sm text-on-surface-variant line-clamp-2')}"></p>
                    </div>

                    <!-- Footer / Info -->
                    <div class="mt-4 pt-3 border-t border-border flex items-center justify-between text-xs text-text-secondary">
                        <span class="flex items-center gap-1">
                            <span th:replace="~{fragments/icon :: icon(name='format_list_numbered', size='sm')}"></span>
                            <span th:text="${choreo.entries.size()} + ' entries'">8 entries</span>
                        </span>
                        <span class="flex items-center gap-1">
                            <span th:replace="~{fragments/icon :: icon(name='schedule', size='sm')}"></span>
                            <span th:text="${#temporals.format(choreo.updatedAt, 'dd MMM yyyy')}">Date</span>
                        </span>
                    </div>
                </div>

                <!-- Action Dropdown (Stacking fixes) -->
                <div class="absolute top-4 right-4 z-20 pointer-events-auto">
                    <div class="relative inline-block text-left">
                        <button type="button" class="js-menu-btn w-11 h-11 rounded-full hover:bg-surface-warm text-text-secondary hover:text-text-primary transition-colors flex items-center justify-center" aria-label="More actions">
                            <span th:replace="~{fragments/icon :: icon(name='more_vert', size='md')}"></span>
                        </button>
                        <!-- Menu Panel -->
                        <div class="js-menu-dropdown absolute right-0 mt-1 w-40 bg-surface rounded-lg shadow-lg border border-outline-variant py-1 hidden z-50">
                            <a th:href="@{/choreographies/{id}(id=${choreo.id})}" class="flex items-center gap-2 px-4 py-2 text-sm text-on-surface hover:bg-surface-warm transition-colors">
                                <span th:replace="~{fragments/icon :: icon(name='visibility', size='sm')}"></span> Open
                            </a>
                            <a th:href="@{/choreographies/{id}/edit(id=${choreo.id})}" class="flex items-center gap-2 px-4 py-2 text-sm text-on-surface hover:bg-surface-warm transition-colors">
                                <span th:replace="~{fragments/icon :: icon(name='edit', size='sm')}"></span> Build
                            </a>
                            <form th:action="@{/choreographies/{id}/duplicate(id=${choreo.id})}" method="post">
                                <button type="submit" class="w-full flex items-center gap-2 px-4 py-2 text-sm text-on-surface hover:bg-surface-warm transition-colors text-left">
                                    <span th:replace="~{fragments/icon :: icon(name='content_copy', size='sm')}"></span> Duplicate
                                </button>
                            </form>
                            <hr class="border-border my-1">
                            <form th:action="@{/choreographies/{id}/delete(id=${choreo.id})}" method="post"
                                  th:data-confirm="'Are you sure you want to delete this choreography?'">
                                <button type="submit" class="w-full flex items-center gap-2 px-4 py-2 text-sm text-error hover:bg-surface-warm transition-colors text-left">
                                    <span th:replace="~{fragments/icon :: icon(name='delete', size='sm')}"></span> Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 2. Compact List View -->
        <div th:if="${!#lists.isEmpty(choreographies) && (currentView == 'list' || currentView == null)}" class="flex flex-col gap-3">
            <div th:each="choreo : ${choreographies}"
                 class="card relative group flex items-center justify-between p-4 hover:z-30 focus-within:z-30">
                
                <!-- Main Link -->
                <a th:href="@{/choreographies/{id}(id=${choreo.id})}" class="absolute inset-0 z-0 rounded-lg"><span class="sr-only">View</span></a>

                <div class="relative z-10 pointer-events-none flex items-center gap-4 flex-1 pr-16 overflow-hidden">
                    <div class="w-10 h-10 rounded-lg bg-surface-warm shrink-0 flex items-center justify-center text-text-secondary">
                        <span th:replace="~{fragments/icon :: icon(name=${choreo.isPublic ? 'public' : 'lock'}, size='md')}"></span>
                    </div>
                    <div class="flex flex-col overflow-hidden">
                        <div class="flex items-center gap-2 mb-1">
                            <h3 class="text-body-md font-bold text-on-surface whitespace-nowrap overflow-hidden text-ellipsis" th:text="${choreo.name}">Competition Waltz</h3>
                            <span class="bg-primary-container/20 text-on-surface px-2 py-0.5 rounded-full text-[9px] font-label-sm uppercase tracking-wider border border-primary-container/30 shrink-0"
                                  th:text="${choreo.danceType != null ? choreo.danceType.name : 'Unknown'}">Waltz</span>
                        </div>
                        <p th:replace="~{fragments/rich-text :: excerpt(value=${choreo.description}, max=80, fallback='No description.', cls='text-xs text-on-surface-variant line-clamp-1')}"></p>
                    </div>
                </div>

                <div class="relative z-10 flex items-center gap-4 shrink-0">
                    <div class="hidden sm:flex flex-col items-end text-right text-xs text-text-secondary">
                        <span class="font-medium" th:text="${choreo.entries.size()} + ' entries'">8 entries</span>
                        <span th:text="${#temporals.format(choreo.updatedAt, 'dd MMM yyyy')}">Date</span>
                    </div>

                    <!-- Action Dropdown -->
                    <div class="relative inline-block text-left">
                        <button type="button" class="js-menu-btn w-11 h-11 rounded-full hover:bg-surface-warm text-text-secondary hover:text-text-primary transition-colors flex items-center justify-center" aria-label="More actions">
                            <span th:replace="~{fragments/icon :: icon(name='more_vert', size='md')}"></span>
                        </button>
                        <!-- Menu Panel -->
                        <div class="js-menu-dropdown absolute right-0 mt-1 w-40 bg-surface rounded-lg shadow-lg border border-outline-variant py-1 hidden z-50">
                            <a th:href="@{/choreographies/{id}(id=${choreo.id})}" class="flex items-center gap-2 px-4 py-2 text-sm text-on-surface hover:bg-surface-warm transition-colors">
                                <span th:replace="~{fragments/icon :: icon(name='visibility', size='sm')}"></span> Open
                            </a>
                            <a th:href="@{/choreographies/{id}/edit(id=${choreo.id})}" class="flex items-center gap-2 px-4 py-2 text-sm text-on-surface hover:bg-surface-warm transition-colors">
                                <span th:replace="~{fragments/icon :: icon(name='edit', size='sm')}"></span> Build
                            </a>
                            <form th:action="@{/choreographies/{id}/duplicate(id=${choreo.id})}" method="post">
                                <button type="submit" class="w-full flex items-center gap-2 px-4 py-2 text-sm text-on-surface hover:bg-surface-warm transition-colors text-left">
                                    <span th:replace="~{fragments/icon :: icon(name='content_copy', size='sm')}"></span> Duplicate
                                </button>
                            </form>
                            <hr class="border-border my-1">
                            <form th:action="@{/choreographies/{id}/delete(id=${choreo.id})}" method="post"
                                  th:data-confirm="'Are you sure you want to delete this choreography?'">
                                <button type="submit" class="w-full flex items-center gap-2 px-4 py-2 text-sm text-error hover:bg-surface-warm transition-colors text-left">
                                    <span th:replace="~{fragments/icon :: icon(name='delete', size='sm')}"></span> Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

</section>
</html>
