<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="activeNav='training-events'" class="space-y-lg relative">

    <div th:replace="~{fragments/page :: pageHeader(
        title='Training Calendars',
        subtitle='Manage connected Google calendars, sources, and sharing.',
        actionUrl='/training-calendars/new',
        actionText='Connect Calendar',
        actionIcon='add',
        actionVariant='primary')}"></div>

    <div th:if="${calendarSuccess != null}">
        <div th:replace="~{fragments/alert :: alert(variant='success', text=${calendarSuccess})}"></div>
    </div>
    <div th:if="${calendarError != null}">
        <div th:replace="~{fragments/alert :: alert(variant='danger', text=${calendarError})}"></div>
    </div>

    <th:block th:if="${pendingInvites != null and !pendingInvites.isEmpty()}">
        <div class="card p-4 space-y-3 bg-surface-container-low border border-border">
            <div th:replace="~{fragments/page :: sectionTitle(title='Pending Calendar Invitations', icon='mail')}"></div>
            <div class="divide-y divide-border">
                <div th:each="inv : ${pendingInvites}" class="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                        <div class="font-medium text-on-surface" th:text="${inv.calendar.displayName}">Shared Calendar</div>
                        <div class="text-xs text-on-surface-variant">
                            Invited by <span th:text="${inv.calendar.owner?.displayName ?: inv.calendar.owner?.username}">Owner</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <form th:action="@{/training-calendars/invites/{id}/accept(id=${inv.id})}" method="post" class="inline">
                            <button type="submit" class="btn-primary btn-sm">Accept</button>
                        </form>
                        <form th:action="@{/training-calendars/invites/{id}/decline(id=${inv.id})}" method="post" class="inline">
                            <button type="submit" class="btn-ghost btn-sm text-error">Decline</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <th:block th:if="${calendars == null || calendars.isEmpty()}">
        <div th:replace="~{fragments/empty :: emptyState(
            icon='calendar_month',
            title='No calendars connected',
            text='Connect your Google Calendar to start tracking training sessions.',
            actionHref='/training-calendars/new',
            actionLabel='Connect Calendar')}"></div>
    </th:block>

    <div th:unless="${calendars == null || calendars.isEmpty()}" class="card overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-border bg-surface-container-low text-xs font-semibold text-on-surface-variant uppercase tracking-wider">
                        <th class="py-3 px-4">Calendar</th>
                        <th class="py-3 px-4">Owner</th>
                        <th class="py-3 px-4">Visibility</th>
                        <th class="py-3 px-4">Google Sources</th>
                        <th class="py-3 px-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-border text-sm">
                    <tr th:each="cal : ${calendars}" class="hover:bg-surface-container-lowest/50 transition-colors">
                        <td class="py-3 px-4 font-medium text-on-surface">
                            <div class="flex items-center gap-2">
                                <span th:if="${cal.color != null}" class="w-3 h-3 rounded-full shrink-0" th:style="'background-color:' + ${cal.color}"></span>
                                <span th:text="${cal.displayName}">Primary</span>
                                <th:block th:if="${cal.isDefaultFor(currentUser)}">
                                    <span th:replace="~{fragments/badge :: badge(label='Default', variant='primary')}"></span>
                                </th:block>
                                <th:block th:unless="${cal.enabled}">
                                    <span th:replace="~{fragments/badge :: badge(label='Disabled', variant='warning')}"></span>
                                </th:block>
                            </div>
                        </td>
                        <td class="py-3 px-4 text-on-surface-variant">
                            <span th:text="${cal.owner?.id == currentUser.id ? 'You' : (cal.owner?.displayName ?: cal.owner?.username)}">You</span>
                        </td>
                        <td class="py-3 px-4">
                            <th:block th:if="${cal.visibility == T(com.jankowski.rafal.dancebook.model.Visibility).PUBLIC}">
                                <span th:replace="~{fragments/badge :: badge(label='Public', variant='accent')}"></span>
                            </th:block>
                            <th:block th:if="${cal.visibility == T(com.jankowski.rafal.dancebook.model.Visibility).PRIVATE}">
                                <span th:replace="~{fragments/badge :: badge(label='Private', variant='neutral')}"></span>
                            </th:block>
                        </td>
                        <td class="py-3 px-4 text-xs text-on-surface-variant space-y-1">
                            <div th:each="src : ${cal.sources}" class="flex items-center gap-2 flex-wrap">
                                <span class="font-medium text-on-surface" th:text="${src.effectiveName}" th:title="${src.googleCalendarId}">source@gmail.com</span>
                                <th:block th:if="${src.isWriteTarget}">
                                    <span th:replace="~{fragments/badge :: badge(label='Write Target', variant='success')}"></span>
                                </th:block>
                            </div>
                        </td>
                        <td class="py-3 px-4 text-right">
                            <div class="inline-flex items-center gap-2 justify-end">
                                <form th:if="${!cal.isDefaultFor(currentUser)}"
                                      th:action="@{/training-calendars/{id}/default(id=${cal.id})}" method="post" class="inline">
                                    <button type="submit" class="btn-ghost btn-sm" title="Set as default calendar">Make Default</button>
                                </form>

                                <th:block th:if="${cal.owner?.id == currentUser.id || currentUser.role == T(com.jankowski.rafal.dancebook.model.Role).ADMIN}">
                                    <a th:href="@{/training-calendars/{id}/edit(id=${cal.id})}" class="btn-outline btn-sm">Edit</a>

                                    <button th:if="${cal.visibility == T(com.jankowski.rafal.dancebook.model.Visibility).PRIVATE}"
                                            type="button" class="btn-outline btn-sm"
                                            th:hx-get="@{/training-calendars/{id}/publish-dialog(id=${cal.id})}"
                                            hx-target="#confirmModalContainer">Publish</button>

                                    <button th:if="${cal.visibility == T(com.jankowski.rafal.dancebook.model.Visibility).PUBLIC}"
                                            type="button" class="btn-ghost btn-sm"
                                            th:hx-get="@{/training-calendars/{id}/unpublish-dialog(id=${cal.id})}"
                                            hx-target="#confirmModalContainer">Make Private</button>

                                    <button type="button" class="btn-ghost btn-sm text-error"
                                            th:hx-get="@{/training-calendars/{id}/delete-dialog(id=${cal.id})}"
                                            hx-target="#confirmModalContainer">Delete</button>
                                </th:block>

                                <th:block th:if="${cal.owner?.id != currentUser.id && subscribedCalendarIds != null && subscribedCalendarIds.contains(cal.id)}">
                                    <form th:action="@{/training-calendars/{id}/unsubscribe(id=${cal.id})}" method="post" class="inline">
                                        <button type="submit" class="btn-ghost btn-sm text-error">Unsubscribe</button>
                                    </form>
                                </th:block>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <th:block th:if="${publicCalendars != null and !publicCalendars.isEmpty()}">
        <div class="space-y-3">
            <div th:replace="~{fragments/page :: sectionTitle(title='Public Calendars', icon='public')}"></div>
            <div class="card overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-border bg-surface-container-low text-xs font-semibold text-on-surface-variant uppercase tracking-wider">
                                <th class="py-3 px-4">Calendar</th>
                                <th class="py-3 px-4">Owner</th>
                                <th class="py-3 px-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-border text-sm">
                            <tr th:each="pubCal : ${publicCalendars}" class="hover:bg-surface-container-lowest/50 transition-colors">
                                <td class="py-3 px-4 font-medium text-on-surface">
                                    <div class="flex items-center gap-2">
                                        <span th:if="${pubCal.color != null}" class="w-3 h-3 rounded-full shrink-0" th:style="'background-color:' + ${pubCal.color}"></span>
                                        <span th:text="${pubCal.displayName}">Club Calendar</span>
                                        <th:block th:if="${subscribedCalendarIds != null && subscribedCalendarIds.contains(pubCal.id)}">
                                            <span th:replace="~{fragments/badge :: badge(label='Subscribed', variant='accent')}"></span>
                                        </th:block>
                                    </div>
                                </td>
                                <td class="py-3 px-4 text-on-surface-variant">
                                    <span th:text="${pubCal.owner?.displayName ?: pubCal.owner?.username}">Owner</span>
                                </td>
                                <td class="py-3 px-4 text-right">
                                    <th:block th:if="${subscribedCalendarIds != null && subscribedCalendarIds.contains(pubCal.id)}">
                                        <form th:action="@{/training-calendars/{id}/unsubscribe(id=${pubCal.id})}" method="post" class="inline">
                                            <button type="submit" class="btn-ghost btn-sm text-error">Unsubscribe</button>
                                        </form>
                                    </th:block>
                                    <th:block th:unless="${subscribedCalendarIds != null && subscribedCalendarIds.contains(pubCal.id)}">
                                        <form th:action="@{/training-calendars/{id}/subscribe(id=${pubCal.id})}" method="post" class="inline">
                                            <button type="submit" class="btn-outline btn-sm">Subscribe</button>
                                        </form>
                                    </th:block>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </th:block>

</section>
</html>
