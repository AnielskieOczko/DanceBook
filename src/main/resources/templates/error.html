<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="pageTitle='Error'" class="flex flex-col items-center justify-center py-16 text-center max-w-[28rem] mx-auto">
    <div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-6 text-on-surface-variant">
        <span th:replace="~{fragments/icon :: icon(name='info', size='lg', cls='text-[32px]')}"></span>
    </div>
    <h1 class="font-display-lg text-2xl font-semibold text-on-surface mb-2"
        th:text="${status != null ? 'Error ' + status : 'Unexpected Error'}">Unexpected Error</h1>
    <p class="font-body-md text-on-surface-variant mb-8 leading-relaxed">
        The requested action could not be completed. Please check your request or return to the dashboard.
    </p>
    <a href="/" class="btn-primary">
        <span th:replace="~{fragments/icon :: icon(name='home', size='md')}"></span>
        <span>Back to Dashboard</span>
    </a>
</section>
</html>
