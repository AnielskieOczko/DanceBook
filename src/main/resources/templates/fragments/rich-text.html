<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Rich text content display: single permitted site for unescaped HTML rendering -->
<div th:fragment="content"
     th:if="${value != null}"
     class="rich-text text-on-surface"
     th:classappend="${cls}"
     th:utext="${@richTextService.render(value)}">Content</div>

<!-- Excerpt display with length truncation: guaranteed plain-text and escaped -->
<p th:fragment="excerpt"
   class="text-on-surface-variant line-clamp-2"
   th:classappend="${cls}"
   th:text="${@richTextService.excerpt(value, max ?: 160) ?: fallback}">Excerpt</p>

</body>
</html>
