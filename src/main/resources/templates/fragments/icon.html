<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<span th:fragment="icon"
      th:id="${id}"
      th:title="${title}"
      class="material-symbols-outlined shrink-0 select-none"
      th:classappend="${(size == 'sm' ? 'text-[1rem]' : (size == 'lg' ? 'text-[1.5rem]' : 'text-[1.25rem]')) + (filled == true ? ' icon-filled' : '') + (cls != null ? ' ' + cls : '')}"
      th:attr="aria-hidden=${ariaLabel == null ? 'true' : 'false'}, aria-label=${ariaLabel}"
      th:text="${name}">icon</span>

</body>
</html>
