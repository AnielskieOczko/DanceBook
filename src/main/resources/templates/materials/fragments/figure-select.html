<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Legacy inline figure fragment preserved for /dance-figures/inline -->
<div id="figureSelectFragment" th:fragment="figureSelectFragment">
    <label for="danceFigureId" class="form-label">Select Figure</label>
    <div class="relative flex items-center gap-2">
        <select name="danceFigureId" id="danceFigureId" class="form-select flex-1 min-w-0">
            <option value="">Select a figure...</option>
            <option th:each="df : ${availableFigures}" th:value="${df.id}" th:text="${df.name + (df.danceClass != null ? ' (' + df.danceClass + ')' : '') + (df.alternativeTiming != null ? ' [' + df.alternativeTiming + ']' : '')}">
                Figure Name
            </option>
        </select>
    </div>
    <span th:if="${inlineError != null}" class="text-error font-body-sm text-[12px] block mt-1" th:text="${inlineError}">Error message</span>
</div>

</body>
</html>
