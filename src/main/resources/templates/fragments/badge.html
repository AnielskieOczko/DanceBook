<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Standard Badge -->
<span th:fragment="badge"
      class="badge"
      th:classappend="${(variant == 'primary' ? 'badge-primary' : (variant == 'secondary' ? 'badge-secondary' : (variant == 'accent' ? 'badge-accent' : (variant == 'danger' or variant == 'error' ? 'badge-danger' : (variant == 'success' ? 'badge-success' : 'badge-neutral'))))) + (cls != null ? ' ' + cls : '')}">
    <th:block th:if="${icon != null}">
        <span th:replace="~{fragments/icon :: icon(name=${icon}, size='sm')}"></span>
    </th:block>
    <span th:text="${label}">Badge</span>
</span>

<!-- Training Event Attendance Badge (4 States + Unconfirmed) -->
<th:block th:fragment="attendanceBadge"
          th:with="statusName=${event != null ? (event.attendanceStatus != null ? event.attendanceStatus.name() : (event.name != null ? event.name() : event.toString())) : 'PLANNED'},
                   isUnconfirmed=${event != null and event.isAwaitingConfirmation != null and event.isAwaitingConfirmation}">
    <span class="badge"
          th:classappend="${(isUnconfirmed ? 'bg-warning/10 text-warning border border-warning/30' :
                             (statusName == 'ATTENDED' ? 'badge-success' :
                              (statusName == 'SKIPPED' ? 'badge-danger' : 'badge-neutral'))) +
                           (cls != null ? ' ' + cls : '')}"
          th:text="${isUnconfirmed ? 'UNCONFIRMED' : statusName}">PLANNED</span>
</th:block>

</body>
</html>
