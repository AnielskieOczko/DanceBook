
spring.application.name=DanceBook

spring.messages.basename=messages
spring.messages.encoding=UTF-8


spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool tuned for Neon serverless postgres (5-minute scale-to-zero suspend):
# max-lifetime (4m) and idle-timeout (2m) are strictly shorter than Neon's 5-minute idle cutoff;
# minimum-idle=0 lets the pool drain during idle periods so no dead handles linger across suspends.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Open-in-view is registered by config/JpaWebConfig so video streaming can be excluded from it
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.threads.virtual.enabled=true

# Google Drive - Server-side auth (no user popup needed)
google.drive.client-id=${GOOGLE_CLIENT_ID}
google.drive.client-secret=${GOOGLE_CLIENT_SECRET}
google.drive.refresh-token=${GOOGLE_REFRESH_TOKEN}
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID}

# Google Calendar - Training calendar sync (separate refresh token, calendar scope)
google.calendar.client-id=${GOOGLE_CLIENT_ID}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET}
google.calendar.refresh-token=${GOOGLE_CALENDAR_REFRESH_TOKEN:}
google.calendar.calendar-id=${GOOGLE_CALENDAR_ID:}
google.calendar.time-zone=${APP_CALENDAR_TIME_ZONE:Europe/Warsaw}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=profile,email

# Security Configuration
dancebook.security.root-admin=rafal
dancebook.security.root-password=${ROOT_ADMIN_PASSWORD:change_me_immediately}

# OpenRouter LLM Configuration
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.default-model=nvidia/nemotron-3-nano-30b-a3b:free
openrouter.timeout-seconds=120
openrouter.rewrite-model=qwen/qwen3.8-27b:free
openrouter.rewrite-providers=modelrun/fp4
openrouter.figure-suggestion-model=qwen/qwen3.8-27b:free
openrouter.figure-suggestion-providers=modelrun/fp4

# Google AI Configuration
google.ai.api-key=${GOOGLE_AI_API_KEY:}

# Ollama Cloud Configuration
ollama.api-key=${OLLAMA_API_KEY:}
ollama.base-url=${OLLAMA_BASE_URL:https://ollama.com}

# Spring Boot Actuator Configuration
# Expose only health and metrics. Never expose env, beans, configprops, or heapdump.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.env.enabled=false
management.endpoint.configprops.enabled=false




