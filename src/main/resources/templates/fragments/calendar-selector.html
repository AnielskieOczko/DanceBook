<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="calendarSelector" class="flex items-center gap-3">
    <div th:if="${selectableCalendars != null && selectableCalendars.size() > 1}"
         class="flex items-center gap-2">
        <label for="activeCalendar" class="form-label mb-0">Calendar</label>
        <select id="activeCalendar" name="calendarId" class="form-select"
                hx-post="/training-events/active-calendar" hx-trigger="change">
            <option value="ALL" th:selected="${activeCalendar == null}">All calendars</option>
            <option th:each="cal : ${selectableCalendars}"
                    th:value="${cal.id}"
                    th:selected="${activeCalendar != null && activeCalendar.id == cal.id}"
                    th:text="${cal.enabled} ? ${cal.displayName} : ${cal.displayName} + ' (disabled)'">
                Calendar
            </option>
        </select>
    </div>
    <button type="button" class="btn-outline flex items-center gap-1 text-sm py-1.5 px-3"
            hx-post="/training-events/sync" hx-swap="none" title="Sync with Google Calendar">
        <span th:replace="~{fragments/icon :: icon(name='sync', size='sm')}"></span>
        <span>Sync now</span>
    </button>
    <span class="text-xs text-text-secondary whitespace-nowrap"
          th:text="${lastSyncedAt != null ? 'Synced ' + #temporals.format(lastSyncedAt, 'HH:mm') : 'Never synced'}"
          th:title="${lastSyncedAt != null ? #temporals.format(lastSyncedAt, 'MMM dd, yyyy HH:mm') : 'Never synced'}">Never synced</span>
</div>

</body>
</html>
