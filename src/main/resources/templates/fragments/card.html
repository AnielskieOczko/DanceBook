<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Stat Card -->
<th:block th:fragment="statCard">
    <a th:if="${href != null}"
       th:href="${href}"
       class="stat-card group cursor-pointer hover:border-outline transition-colors"
       th:classappend="${cls}">
        <div th:if="${icon != null}" class="stat-card-icon text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
            <span th:replace="~{fragments/icon :: icon(name=${icon}, size='lg')}"></span>
        </div>
        <div>
            <div class="stat-card-value" th:text="${value}">0</div>
            <div class="stat-card-label" th:text="${label}">Label</div>
            <div th:if="${caption != null}" class="text-sm text-on-surface-variant" th:text="${caption}"></div>
        </div>
        <div th:if="${trend != null}"
             class="text-xs flex items-center gap-1"
             th:classappend="${trendUp == true ? 'text-primary' : (trendUp == false ? 'text-error' : 'text-on-surface-variant')}">
            <th:block th:if="${trendUp != null}">
                <span th:replace="~{fragments/icon :: icon(name=${trendUp ? 'trending_up' : 'trending_down'}, size='sm')}"></span>
            </th:block>
            <span th:text="${trend}">+10%</span>
        </div>
    </a>
    <div th:if="${href == null}"
         class="stat-card"
         th:classappend="${cls}">
        <div th:if="${icon != null}" class="stat-card-icon text-primary">
            <span th:replace="~{fragments/icon :: icon(name=${icon}, size='lg')}"></span>
        </div>
        <div>
            <div class="stat-card-value" th:text="${value}">0</div>
            <div class="stat-card-label" th:text="${label}">Label</div>
            <div th:if="${caption != null}" class="text-sm text-on-surface-variant" th:text="${caption}"></div>
        </div>
        <div th:if="${trend != null}"
             class="text-xs flex items-center gap-1"
             th:classappend="${trendUp == true ? 'text-primary' : (trendUp == false ? 'text-error' : 'text-on-surface-variant')}">
            <th:block th:if="${trendUp != null}">
                <span th:replace="~{fragments/icon :: icon(name=${trendUp ? 'trending_up' : 'trending_down'}, size='sm')}"></span>
            </th:block>
            <span th:text="${trend}">+10%</span>
        </div>
    </div>
</th:block>

<!-- Remarks Card (Direction A: outlined card for advice, technical remarks, recommendations) -->
<div th:fragment="remarksCard"
     class="card-remarks"
     th:classappend="${cls}">
    <div th:if="${title != null}" class="flex items-center gap-2">
        <th:block th:if="${icon != null}">
            <span th:replace="~{fragments/icon :: icon(name=${icon}, size='sm', cls='text-primary')}"></span>
        </th:block>
        <h3 class="card-remarks-title" th:text="${title}">Title</h3>
    </div>
    <div th:if="${lead != null}" class="lead" th:text="${lead}">Lead-in</div>
    <th:block th:if="${body != null}">
        <th:block th:replace="${body}"></th:block>
    </th:block>
    <th:block th:if="${text != null}">
        <div th:replace="~{fragments/rich-text :: content(value=${text})}"></div>
    </th:block>
</div>

</body>
</html>
