<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="pageTitle='Server Error'" class="flex flex-col items-center justify-center py-16 text-center max-w-[28rem] mx-auto">
    <div class="w-16 h-16 rounded-full bg-error/10 text-error flex items-center justify-center mb-6">
        <span th:replace="~{fragments/icon :: icon(name='error', size='lg', cls='text-[32px]')}"></span>
    </div>
    <h1 class="font-display-lg text-2xl font-semibold text-on-surface mb-2">Something Went Wrong</h1>
    <p class="font-body-md text-on-surface-variant mb-8 leading-relaxed">
        An unexpected error occurred while processing your request. Please try again or return to the dashboard.
    </p>
    <a href="/" class="btn-primary">
        <span th:replace="~{fragments/icon :: icon(name='home', size='md')}"></span>
        <span>Back to Dashboard</span>
    </a>
</section>
</html>
