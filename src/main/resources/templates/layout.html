<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="html(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
    <title th:text="${pageTitle != null ? pageTitle + ' · CHOREO' : 'CHOREO'}">CHOREO</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <link th:href="@{/css/output.css}" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script th:src="@{/js/main.js}"></script>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen pb-24 md:pb-0"
      th:data-poll-interval="${pollInterval != null ? pollInterval : 5}"
      th:data-logout-interval="${autoLogout != null ? autoLogout : 10}">

<!-- ═══════════════════════════════════════════════
     TOP APP BAR (Sticky)
     ═══════════════════════════════════════════════ -->
<header class="bg-surface sticky top-0 z-50 transition-all duration-300 shadow-ambient" sec:authorize="isAuthenticated()">
    <div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
        <!-- Brand -->
        <a href="/" class="flex items-center">
            <h1 class="text-on-surface font-display-lg text-[20px] tracking-[0.2em] font-semibold uppercase">CHOREO</h1>
        </a>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center gap-2">
            <a href="/" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'home' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}">Dashboard</a>
            <a href="/materials" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'materials' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}">Notes</a>
            <a href="/dance-figures" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'dance-figures' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}">Figures</a>
            <a href="/lists" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'lists' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}">Collections</a>
            <a href="/choreographies" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'choreographies' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}">Choreographies</a>
            <a href="/training-events" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'training-events' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}">Training</a>
        </nav>

        <!-- Trailing Icons -->
        <div class="flex items-center gap-4">
            <a sec:authorize="hasRole('ADMIN')" href="/admin" class="hidden md:flex items-center justify-center min-h-[44px] min-w-[44px] p-2.5 rounded-full text-outline hover:text-on-surface transition-colors" aria-label="Admin Dashboard" title="Admin Dashboard">
                <span th:replace="~{fragments/icon :: icon(name='settings', size='md')}"></span>
            </a>

            <!-- Notification Bell -->
            <div class="relative" id="notification-bell-wrapper">
                <button id="notification-bell"
                        class="relative flex items-center justify-center min-h-[44px] min-w-[44px] p-2.5 rounded-full text-outline hover:text-on-surface transition-colors"
                        hx-get="/notifications"
                        hx-target="#notification-dropdown"
                        hx-swap="innerHTML"
                        aria-label="Notifications"
                        title="Notifications">
                    <span th:replace="~{fragments/icon :: icon(name='notifications', size='md')}"></span>
                    <!-- Badge (HTMX polling) -->
                    <span id="notification-badge"
                          hx-get="/notifications/count"
                          hx-trigger="load, poll-notifications from:body"
                          hx-swap="innerHTML">
                        <span th:if="${unreadNotificationCount != null && unreadNotificationCount > 0}"
                              class="absolute top-1 right-1 min-w-[18px] h-[18px] flex items-center justify-center bg-error text-on-error text-[10px] font-bold rounded-full px-1"
                              th:text="${unreadNotificationCount}">3</span>
                    </span>
                </button>
                <!-- Dropdown Panel (filled by HTMX) -->
                <div id="notification-dropdown" class="hidden absolute right-0 top-full mt-2 w-80 md:w-96 z-50"></div>
            </div>

            <div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden border border-outline-variant flex-shrink-0 cursor-pointer hover:border-outline transition-colors">
                <a href="/profile">
                    <div class="w-full h-full flex items-center justify-center bg-primary-container text-on-primary-container font-bold">
                        <span th:text="${currentUser != null && currentUser.displayName != null ? currentUser.displayName.substring(0,1) : 'U'}">U</span>
                    </div>
                </a>
            </div>
        </div>
    </div>
</header>

<!-- ═══════════════════════════════════════════════
     MAIN CONTENT AREA
     ═══════════════════════════════════════════════ -->
<main class="max-w-7xl mx-auto px-6 py-lg md:py-xl">
    <!-- Global dynamic alert container for background/HTMX failures -->
    <div id="alert-container" class="mb-6 empty:hidden"></div>
    <!-- Page content injected here -->
    <div th:replace="${content}"></div>
</main>

<!-- ═══════════════════════════════════════════════
     BOTTOM NAV BAR (Mobile Only)
     ═══════════════════════════════════════════════ -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-1 py-3 pb-safe bg-surface shadow-ambient rounded-t-xl z-50" sec:authorize="isAuthenticated()">
    <!-- Dashboard -->
    <a href="/" class="flex flex-col items-center justify-center transition-all duration-150 min-h-[44px] min-w-0 flex-1 px-0.5"
       th:classappend="${activeNav == 'home' ? 'text-on-surface bottom-nav-item-active' : 'text-outline'}">
        <span th:replace="~{fragments/icon :: icon(name='grid_view', size='md', filled=${activeNav == 'home'})}"></span>
        <span class="font-label-sm text-[11px] font-medium mt-1">Dashboard</span>
    </a>
    <!-- Notes -->
    <a href="/materials" class="flex flex-col items-center justify-center transition-all duration-150 min-h-[44px] min-w-0 flex-1 px-0.5"
       th:classappend="${activeNav == 'materials' ? 'text-on-surface bottom-nav-item-active' : 'text-outline'}">
        <span th:replace="~{fragments/icon :: icon(name='subscriptions', size='md', filled=${activeNav == 'materials'})}"></span>
        <span class="font-label-sm text-[11px] font-medium mt-1">Notes</span>
    </a>
    <!-- Figures -->
    <a href="/dance-figures" class="flex flex-col items-center justify-center transition-all duration-150 min-h-[44px] min-w-0 flex-1 px-0.5"
       th:classappend="${activeNav == 'dance-figures' ? 'text-on-surface bottom-nav-item-active' : 'text-outline'}">
        <span th:replace="~{fragments/icon :: icon(name='accessibility_new', size='md', filled=${activeNav == 'dance-figures'})}"></span>
        <span class="font-label-sm text-[11px] font-medium mt-1">Figures</span>
    </a>
    <!-- Collections -->
    <a href="/lists" class="flex flex-col items-center justify-center transition-all duration-150 min-h-[44px] min-w-0 flex-1 px-0.5"
       th:classappend="${activeNav == 'lists' ? 'text-on-surface bottom-nav-item-active' : 'text-outline'}">
        <span th:replace="~{fragments/icon :: icon(name='layers', size='md', filled=${activeNav == 'lists'})}"></span>
        <span class="font-label-sm text-[11px] font-medium mt-1">Collections</span>
    </a>
    <!-- Choreographies -->
    <a href="/choreographies" aria-label="Choreographies" class="flex flex-col items-center justify-center transition-all duration-150 min-h-[44px] min-w-0 flex-1 px-0.5"
       th:classappend="${activeNav == 'choreographies' ? 'text-on-surface bottom-nav-item-active' : 'text-outline'}">
        <span th:replace="~{fragments/icon :: icon(name='route', size='md', filled=${activeNav == 'choreographies'})}"></span>
        <span class="font-label-sm text-[11px] font-medium mt-1" aria-hidden="true">Choreos</span>
    </a>
    <!-- Training -->
    <a href="/training-events" class="flex flex-col items-center justify-center transition-all duration-150 min-h-[44px] min-w-0 flex-1 px-0.5"
       th:classappend="${activeNav == 'training-events' ? 'text-on-surface bottom-nav-item-active' : 'text-outline'}">
        <span th:replace="~{fragments/icon :: icon(name='calendar_month', size='md', filled=${activeNav == 'training-events'})}"></span>
        <span class="font-label-sm text-[11px] font-medium mt-1">Training</span>
    </a>
</nav>

<!-- Shared confirm modal container for server-rendered dialogs -->
<div id="confirmModalContainer"></div>

</body>
</html>
