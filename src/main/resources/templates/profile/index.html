<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="activeNav='profile'" class="grid grid-cols-1 md:grid-cols-12 gap-gutter">

    <!-- Profile Header / Stats -->
    <section class="md:col-span-4 flex flex-col items-center md:items-start space-y-md">
        <div class="w-32 h-32 md:w-48 md:h-48 rounded-full overflow-hidden bg-surface-container-highest border-4 border-surface relative group">
            <div class="w-full h-full flex items-center justify-center bg-primary-container text-on-primary-container font-bold text-4xl">
                <span th:text="${appUser.displayName != null ? appUser.displayName.substring(0,1) : 'U'}">U</span>
            </div>
            <button type="button" class="absolute bottom-2 right-2 md:bottom-4 md:right-4 bg-primary-container text-on-primary-container rounded-full min-h-[44px] min-w-[44px] flex items-center justify-center hover:bg-primary-fixed transition-colors" aria-label="Edit avatar" title="Edit avatar">
                <span th:replace="~{fragments/icon :: icon(name='edit', size='sm')}"></span>
            </button>
        </div>
        <div th:replace="~{fragments/page :: header(title=${appUser.displayName}, subtitle=${appUser.role == 'ADMIN' ? 'Administrator' : 'Dance Enthusiast'}, cls='mb-0')}"></div>
        <div class="w-full grid grid-cols-2 gap-sm pt-sm border-t border-outline-variant">
            <div class="bg-surface-container-low p-sm rounded-lg flex flex-col items-center md:items-start">
                <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-xs">Library</span>
                <span class="font-headline-md text-headline-md text-on-surface">124</span>
            </div>
            <div class="bg-surface-container-low p-sm rounded-lg flex flex-col items-center md:items-start">
                <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-xs">Styles</span>
                <span class="font-headline-md text-headline-md text-on-surface">12</span>
            </div>
        </div>
        <button class="btn-primary w-full mt-margin">
            Edit Profile
        </button>
    </section>

    <!-- Main Content Area -->
    <section class="md:col-span-8 space-y-xl mt-xl md:mt-0">
        <!-- Personal Collections (Dynamic Lists) -->
        <div>
            <div class="flex justify-between items-center mb-md border-b border-outline-variant pb-xs">
                <h2 class="font-headline-md text-headline-md text-on-surface">My Collections</h2>
                <a href="/lists/new" class="text-primary hover:text-primary-container transition-colors min-h-[44px] min-w-[44px] inline-flex items-center justify-center" aria-label="New collection" title="New collection">
                    <span th:replace="~{fragments/icon :: icon(name='add_circle', size='md')}"></span>
                </a>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter">
                <!-- If no lists -->
                <div th:if="${#lists.isEmpty(navLists)}" class="col-span-full py-8 text-center text-outline italic text-sm">
                    No custom collections created yet.
                </div>
                
                <!-- Collection Card -->
                <a th:each="list : ${navLists}" th:href="@{/lists/{id}(id=${list.id})}"
                   class="card group overflow-hidden cursor-pointer flex h-24">
                     <div class="w-1/3 bg-surface-container-highest flex items-center justify-center">
                         <span th:replace="~{fragments/icon :: icon(name=${list.isPublic ? 'public' : 'lock'}, size='md', cls='text-outline')}"></span>
                     </div>
                     <div class="w-2/3 p-md flex flex-col justify-center">
                         <h3 class="font-body-lg text-body-lg text-on-surface mb-xs truncate" th:text="${list.name}">Collection Name</h3>
                         <p class="font-body-sm text-body-sm text-on-surface-variant">Filtered Collection</p>
                     </div>
                </a>
            </div>
        </div>

        <!-- Account Settings / Password -->
        <div>
            <div class="mb-md border-b border-outline-variant pb-xs">
                <h2 class="font-headline-md text-headline-md text-on-surface">Account Settings</h2>
            </div>
            
            <div th:fragment="passwordSection" id="password-section" class="space-y-6">
                <h3 class="font-body-lg font-medium text-on-surface">Update Password</h3>
                
                <!-- Messages -->
                <div th:if="${passwordSuccessMsg}" class="p-3 rounded-lg bg-primary/10 text-primary text-sm" th:text="${passwordSuccessMsg}"></div>

                <form th:hx-post="@{/profile/password}" hx-target="#password-section" hx-swap="outerHTML" th:object="${passwordChangeRequest}" class="space-y-6">
                    <div th:replace="~{fragments/form :: errorSummary}"></div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="sm:col-span-2">
                            <div th:replace="~{fragments/form :: field(path='currentPassword', label='Current Password', type='password', required=true, id='currentPassword')}"></div>
                        </div>
                        <div>
                            <div th:replace="~{fragments/form :: field(path='newPassword', label='New Password', type='password', required=true, id='newPassword')}"></div>
                        </div>
                        <div>
                            <div th:replace="~{fragments/form :: field(path='confirmNewPassword', label='Confirm New Password', type='password', required=true, id='confirmPassword')}"></div>
                        </div>
                        <div class="sm:col-span-2 flex justify-end">
                            <button type="submit" class="btn-outline">
                                Update Security
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            
            <ul class="flex flex-col mt-8">
                <li class="border-t border-outline-variant">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="w-full flex items-center gap-sm py-4 text-error hover:opacity-70 transition-colors">
                            <span th:replace="~{fragments/icon :: icon(name='logout', size='md')}"></span>
                            <span class="font-body-md text-body-md font-medium">Log Out</span>
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </section>

</section>
</html>
