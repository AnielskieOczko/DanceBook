<!DOCTYPE html>
<html lang="en"
      th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="html(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
    <title th:text="${pageTitle != null ? pageTitle + ' · ' + (brandName ?: 'DanceBook') : (brandName ?: 'DanceBook')}">DanceBook</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <link th:href="@{/css/output.css}" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script id="i18n-bundle" type="application/json" th:attr="data-messages=${i18nBundle ?: '{}'}"></script>
    <script th:src="@{/js/main.js}"></script>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen pb-24 xl:pb-0"
      th:data-poll-interval="${pollInterval != null ? pollInterval : 5}"
      th:data-logout-interval="${autoLogout != null ? autoLogout : 10}"
      th:data-badge-style="${badgeStyle ?: 'rank_bars'}">

<!-- Top Progress Bar (Issue #390) -->
<div id="top-progress-bar" class="top-progress-bar" aria-hidden="true"></div>

<!-- ═══════════════════════════════════════════════
     TOP APP BAR (Sticky)
     ═══════════════════════════════════════════════ -->
<header class="bg-surface sticky top-0 z-50 transition-all duration-300 shadow-ambient" sec:authorize="isAuthenticated()">
    <div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
        <!-- Brand -->
        <a href="/" class="flex items-center">
            <h1 class="text-on-surface font-display-lg text-[20px] tracking-[0.2em] font-semibold uppercase" th:text="${brandName ?: 'DanceBook'}">DanceBook</h1>
        </a>

        <!-- Desktop Navigation -->
        <nav class="hidden xl:flex items-center gap-2">
            <a href="/" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'home' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}"
               th:text="#{nav.dashboard}">Dashboard</a>
            <a href="/materials" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'materials' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}"
               th:text="#{nav.notes}">Notes</a>
            <a href="/dance-figures" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'dance-figures' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}"
               th:text="#{nav.figures}">Figures</a>
            <a href="/lists" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'lists' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}"
               th:text="#{nav.collections}">Collections</a>
            <a href="/choreographies" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'choreographies' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}"
               th:text="#{nav.choreographies}">Choreographies</a>
            <a href="/training-events" class="font-body-md transition-all duration-200 px-4 py-2 rounded-full"
               th:classappend="${activeNav == 'training-events' ? 'text-primary bg-surface-container-high font-bold' : 'text-secondary hover:text-primary hover:bg-surface-container font-semibold'}"
               th:text="#{nav.training}">Training</a>
        </nav>

        <!-- Trailing Icons -->
        <div class="flex items-center gap-4">
            <a sec:authorize="hasRole('ADMIN')" href="/admin" class="hidden xl:flex items-center justify-center min-h-[44px] min-w-[44px] p-2.5 rounded-full text-outline hover:text-on-surface transition-colors"
               aria-label="Admin Dashboard" title="Admin Dashboard"
               th:attr="aria-label=#{nav.admin_dashboard}, title=#{nav.admin_dashboard}">
                <span th:replace="~{fragments/icon :: icon(name='settings', size='md')}"></span>
            </a>

            <button type="button" th:if="${assistantNav != null}" data-assistant-open
                    class="flex items-center justify-center min-h-[44px] min-w-[44px] p-2.5 rounded-full text-outline hover:text-on-surface transition-colors"
                    aria-label="Open assistant" title="Assistant (press /)"
                    th:attr="aria-label=#{nav.assistant.open}, title=#{nav.assistant.title}">
                <span th:replace="~{fragments/icon :: icon(name='auto_awesome', size='md')}"></span>
            </button>

            <!-- Notification Bell -->
            <div class="relative" id="notification-bell-wrapper">
                <button id="notification-bell"
                        class="relative flex items-center justify-center min-h-[44px] min-w-[44px] p-2.5 rounded-full text-outline hover:text-on-surface transition-colors"
                        hx-get="/notifications"
                        hx-target="#notification-dropdown"
                        hx-swap="innerHTML"
                        aria-label="Notifications"
                        title="Notifications"
                        th:attr="aria-label=#{nav.notifications}, title=#{nav.notifications}">
                    <span th:replace="~{fragments/icon :: icon(name='notifications', size='md')}"></span>
                    <!-- Badge (HTMX polling) -->
                    <span id="notification-badge"
                          hx-get="/notifications/count"
                          hx-trigger="load, poll-notifications from:body"
                          hx-swap="innerHTML">
                        <span th:if="${unreadNotificationCount != null && unreadNotificationCount > 0}"
                              class="absolute top-1 right-1 min-w-[18px] h-[18px] flex items-center justify-center bg-error text-on-error text-[10px] font-bold rounded-full px-1"
                              th:text="${unreadNotificationCount}">3</span>
                    </span>
                </button>
                <!-- Dropdown Panel (filled by HTMX) -->
                <div id="notification-dropdown" class="hidden absolute right-0 top-full mt-2 w-80 md:w-96 z-50"></div>
            </div>

            <!-- Avatar dropdown (desktop and phone) -->
            <details class="relative js-dropdown" id="profile-menu">
                <summary class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant flex items-center justify-center bg-primary-container text-on-primary-container font-bold text-base list-none cursor-pointer select-none hover:border-primary focus-visible:outline-hidden focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 [&::-webkit-details-marker]:hidden"
                         aria-haspopup="menu"
                         aria-label="Menu"
                         th:attr="aria-label=#{nav.menu}">
                    <span th:text="${currentUser != null && currentUser.displayName != null && !currentUser.displayName.isEmpty() ? currentUser.displayName.substring(0,1) : 'U'}">U</span>
                </summary>
                <div class="absolute right-0 top-full mt-2 w-[272px] p-1.5 bg-surface border border-outline-variant rounded-card shadow-ambient z-50 text-on-surface"
                     role="menu"
                     aria-label="Menu"
                     th:attr="aria-label=#{nav.menu}">

                    <!-- Header block (information only, not a link) -->
                    <div class="flex items-center gap-3 px-3 py-2.5 pb-3 border-b border-outline-variant mb-1.5 select-none">
                        <div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant flex items-center justify-center bg-primary-container text-on-primary-container font-bold text-base shrink-0">
                            <span th:text="${currentUser != null && currentUser.displayName != null && !currentUser.displayName.isEmpty() ? currentUser.displayName.substring(0,1) : 'U'}">U</span>
                        </div>
                        <div class="min-w-0 flex-1">
                            <b class="block text-[15px] font-semibold leading-tight text-on-surface truncate"
                               th:text="${currentUser != null && currentUser.displayName != null && !currentUser.displayName.isEmpty() ? currentUser.displayName : (currentUser != null ? currentUser.username : '')}">User</b>
                            <small class="block text-xs text-on-surface-variant truncate"
                                   th:text="${currentUser != null && currentUser.role != null && currentUser.role.name() == 'ADMIN' ? #messages.msg('profile.role.admin') : #messages.msg('profile.role.user')}">Role</small>
                        </div>
                    </div>

                    <!-- Phone-only shortcuts (Choreographies, Collections, Admin for admins) -->
                    <div class="xl:hidden phone-shortcuts">
                        <a href="/choreographies" role="menuitem"
                           class="flex items-center gap-3 w-full min-h-[44px] px-3 py-2 rounded-[12px] text-sm font-medium text-on-surface hover:bg-surface-container transition-colors">
                            <span th:replace="~{fragments/icon :: icon(name='route', size='md', cls='text-outline')}"></span>
                            <span th:text="#{nav.choreographies}">Choreographies</span>
                        </a>
                        <a href="/lists" role="menuitem"
                           class="flex items-center gap-3 w-full min-h-[44px] px-3 py-2 rounded-[12px] text-sm font-medium text-on-surface hover:bg-surface-container transition-colors">
                            <span th:replace="~{fragments/icon :: icon(name='layers', size='md', cls='text-outline')}"></span>
                            <span th:text="#{nav.collections}">Collections</span>
                        </a>
                        <a sec:authorize="hasRole('ADMIN')" href="/admin" role="menuitem"
                           class="flex items-center gap-3 w-full min-h-[44px] px-3 py-2 rounded-[12px] text-sm font-medium text-on-surface hover:bg-surface-container transition-colors">
                            <span th:replace="~{fragments/icon :: icon(name='settings', size='md', cls='text-outline')}"></span>
                            <span th:text="#{nav.admin}">Admin</span>
                        </a>
                        <div class="h-px bg-outline-variant my-1.5 mx-2"></div>
                    </div>

                    <!-- Profile -->
                    <a href="/profile" role="menuitem"
                       aria-label="Profile" th:attr="aria-label=#{nav.profile}"
                       class="flex items-center gap-3 w-full min-h-[44px] px-3 py-2 rounded-[12px] text-sm font-medium text-on-surface hover:bg-surface-container transition-colors">
                        <span th:replace="~{fragments/icon :: icon(name='person', size='md', cls='text-outline')}"></span>
                        <span th:text="#{nav.profile}">Profile</span>
                    </a>

                    <!-- Language button -->
                    <button type="button" role="menuitem" aria-expanded="false" aria-haspopup="true" data-langbtn
                            class="flex items-center gap-3 w-full min-h-[44px] px-3 py-2 rounded-[12px] text-sm font-medium text-on-surface hover:bg-surface-container transition-colors cursor-pointer text-left">
                        <span th:replace="~{fragments/icon :: icon(name='language', size='md', cls='text-outline')}"></span>
                        <span th:text="#{profile.language}">Language</span>
                        <span class="ml-auto flex items-center gap-1 text-on-surface-variant text-[13px] font-normal">
                            <span data-langval th:text="${currentUser != null && currentUser.locale == 'pl' ? #messages.msg('language.pl') : (currentUser != null && currentUser.locale == 'en' ? #messages.msg('language.en') : #messages.msg('language.browser_default'))}">English</span>
                            <span th:replace="~{fragments/icon :: icon(name='expand_more', size='sm', cls='text-outline transition-transform duration-200 js-lang-chev')}"></span>
                        </span>
                    </button>

                    <!-- Language options group (expanded in place) -->
                    <div class="langs ml-3 pl-3 my-1 border-l-2 border-primary-soft hidden" role="group" aria-label="Language" th:attr="aria-label=#{profile.language}" data-langs>
                        <form th:action="@{/profile/locale}" method="post" class="m-0">
                            <input type="hidden" name="locale" value="en">
                            <input type="hidden" name="redirect" th:value="${currentUri ?: ''}" data-current-url>
                            <button type="submit" role="menuitemradio"
                                    th:attr="aria-checked=${currentUser != null && currentUser.locale == 'en'}"
                                    class="flex items-center gap-3 w-full min-h-[40px] px-3 py-1.5 rounded-[12px] text-sm text-left hover:bg-surface-container transition-colors cursor-pointer"
                                    th:classappend="${currentUser != null && currentUser.locale == 'en' ? 'text-primary font-semibold' : 'text-on-surface font-normal'}">
                                <span th:text="#{language.en}">English</span>
                                <span th:replace="~{fragments/icon :: icon(name='check', size='sm', cls='tick ml-auto text-primary')}"></span>
                            </button>
                        </form>
                        <form th:action="@{/profile/locale}" method="post" class="m-0">
                            <input type="hidden" name="locale" value="pl">
                            <input type="hidden" name="redirect" th:value="${currentUri ?: ''}" data-current-url>
                            <button type="submit" role="menuitemradio"
                                    th:attr="aria-checked=${currentUser != null && currentUser.locale == 'pl'}"
                                    class="flex items-center gap-3 w-full min-h-[40px] px-3 py-1.5 rounded-[12px] text-sm text-left hover:bg-surface-container transition-colors cursor-pointer"
                                    th:classappend="${currentUser != null && currentUser.locale == 'pl' ? 'text-primary font-semibold' : 'text-on-surface font-normal'}">
                                <span th:text="#{language.pl}">Polski</span>
                                <span th:replace="~{fragments/icon :: icon(name='check', size='sm', cls='tick ml-auto text-primary')}"></span>
                            </button>
                        </form>
                        <form th:action="@{/profile/locale}" method="post" class="m-0">
                            <input type="hidden" name="locale" value="">
                            <input type="hidden" name="redirect" th:value="${currentUri ?: ''}" data-current-url>
                            <button type="submit" role="menuitemradio"
                                    th:attr="aria-checked=${currentUser == null || currentUser.locale == null || currentUser.locale.isEmpty()}"
                                    class="flex items-center gap-3 w-full min-h-[40px] px-3 py-1.5 rounded-[12px] text-sm text-left hover:bg-surface-container transition-colors cursor-pointer"
                                    th:classappend="${currentUser == null || currentUser.locale == null || currentUser.locale.isEmpty() ? 'text-primary font-semibold' : 'text-on-surface font-normal'}">
                                <span th:text="#{language.browser_default}">Browser default</span>
                                <span th:replace="~{fragments/icon :: icon(name='check', size='sm', cls='tick ml-auto text-primary')}"></span>
                            </button>
                        </form>
                    </div>

                    <!-- Separator -->
                    <div class="h-px bg-outline-variant my-1.5 mx-2"></div>

                    <!-- Log out -->
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" role="menuitem"
                                class="flex items-center gap-3 w-full min-h-[44px] px-3 py-2 rounded-[12px] text-sm font-medium text-error hover:bg-error-container hover:text-error transition-colors cursor-pointer text-left">
                            <span th:replace="~{fragments/icon :: icon(name='logout', size='md', cls='text-error')}"></span>
                            <span th:text="#{profile.logout}">Log Out</span>
                        </button>
                    </form>
                </div>
            </details>
        </div>
    </div>
</header>

<!-- ═══════════════════════════════════════════════
     MAIN CONTENT AREA
     ═══════════════════════════════════════════════ -->
<main class="max-w-7xl mx-auto px-6 py-12 md:py-20">
    <!-- Global dynamic alert container for background/HTMX failures -->
    <div id="alert-container" class="mb-6 empty:hidden"></div>
    <!-- Page content injected here -->
    <div th:replace="${content}"></div>
</main>

<!-- ═══════════════════════════════════════════════
     BOTTOM NAV BAR (Mobile Only)
     ═══════════════════════════════════════════════ -->
<nav class="xl:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-1 py-3 pb-safe bg-surface shadow-ambient rounded-t-xl z-50" sec:authorize="isAuthenticated()">
    <!-- Home -->
    <a href="/" class="flex flex-col items-center justify-center transition-all duration-150 min-h-[44px] min-w-0 flex-1 px-0.5"
       th:classappend="${activeNav == 'home' ? 'text-on-surface bottom-nav-item-active' : 'text-outline'}"
       th:attr="aria-current=${activeNav == 'home' ? 'page' : null}">
        <span th:replace="~{fragments/icon :: icon(name='home', size='md', filled=${activeNav == 'home'})}"></span>
        <span class="font-label-sm text-[11px] font-medium mt-1" th:text="#{nav.home}">Home</span>
    </a>
    <!-- Training -->
    <a href="/training-events" class="flex flex-col items-center justify-center transition-all duration-150 min-h-[44px] min-w-0 flex-1 px-0.5"
       th:classappend="${activeNav == 'training-events' ? 'text-on-surface bottom-nav-item-active' : 'text-outline'}"
       th:attr="aria-current=${activeNav == 'training-events' ? 'page' : null}">
        <span th:replace="~{fragments/icon :: icon(name='calendar_month', size='md', filled=${activeNav == 'training-events'})}"></span>
        <span class="font-label-sm text-[11px] font-medium mt-1" th:text="#{nav.training}">Training</span>
    </a>
    <!-- Notes -->
    <a href="/materials" class="flex flex-col items-center justify-center transition-all duration-150 min-h-[44px] min-w-0 flex-1 px-0.5"
       th:classappend="${activeNav == 'materials' ? 'text-on-surface bottom-nav-item-active' : 'text-outline'}"
       th:attr="aria-current=${activeNav == 'materials' ? 'page' : null}">
        <span th:replace="~{fragments/icon :: icon(name='description', size='md', filled=${activeNav == 'materials'})}"></span>
        <span class="font-label-sm text-[11px] font-medium mt-1" th:text="#{nav.notes}">Notes</span>
    </a>
    <!-- Figures -->
    <a href="/dance-figures" class="flex flex-col items-center justify-center transition-all duration-150 min-h-[44px] min-w-0 flex-1 px-0.5"
       th:classappend="${activeNav == 'dance-figures' ? 'text-on-surface bottom-nav-item-active' : 'text-outline'}"
       th:attr="aria-current=${activeNav == 'dance-figures' ? 'page' : null}">
        <span th:replace="~{fragments/icon :: icon(name='accessibility_new', size='md', filled=${activeNav == 'dance-figures'})}"></span>
        <span class="font-label-sm text-[11px] font-medium mt-1" th:text="#{nav.figures}">Figures</span>
    </a>
</nav>

<th:block th:if="${assistantNav != null}">
    <div th:replace="~{assistant/widget :: widget}"></div>
    <script th:src="@{/js/assistant.js}" defer></script>
</th:block>

<!-- Shared confirm modal container for server-rendered dialogs -->
<div id="confirmModalContainer"></div>

<!-- Go-to top / bottom floating control (#224) -->
<nav id="scrollToControls" class="goto" hidden role="group" aria-label="Scroll the page" th:attr="aria-label=#{nav.scroll.group}">
    <button type="button" id="scrollToTopBtn" disabled
            aria-label="Go to top" title="Go to top"
            th:attr="aria-label=#{nav.scroll.top}, title=#{nav.scroll.top}">
        <span th:replace="~{fragments/icon :: icon(name='keyboard_arrow_up', size='md', title=null)}"></span>
    </button>
    <button type="button" id="scrollToBottomBtn" disabled
            aria-label="Go to bottom" title="Go to bottom"
            th:attr="aria-label=#{nav.scroll.bottom}, title=#{nav.scroll.bottom}">
        <span th:replace="~{fragments/icon :: icon(name='keyboard_arrow_down', size='md', title=null)}"></span>
    </button>
</nav>

</body>
</html>
