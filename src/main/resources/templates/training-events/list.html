<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">

<section th:with="activeNav='training-events'" class="space-y-lg relative">

    <div th:replace="~{fragments/page :: header(title='Training', subtitle=${#lists.size(events)} + ' sessions logged', toolbar=~{::listToolbar})}">
        <div th:fragment="listToolbar" class="flex flex-col sm:flex-row sm:items-center gap-4 shrink-0">
            <div th:replace="~{fragments/calendar-selector :: calendarSelector}"></div>
            <div class="flex flex-wrap items-center gap-2 shrink-0">
                <a href="/training-events/history" class="btn-outline">
                    <span th:replace="~{fragments/icon :: icon(name='history', size='md')}"></span>
                    History
                </a>
                <a href="/training-events/timeline" class="btn-outline">
                    <span th:replace="~{fragments/icon :: icon(name='timeline', size='md')}"></span>
                    Timeline
                </a>
                <a href="/training-events/stats" class="btn-outline">
                    <span th:replace="~{fragments/icon :: icon(name='monitoring', size='md')}"></span>
                    Stats
                </a>
                <a href="/training-events/calendar" class="btn-outline">
                    <span th:replace="~{fragments/icon :: icon(name='calendar_month', size='md')}"></span>
                    Calendar
                </a>
                <a href="/training-events/new" class="btn-primary"
                   th:if="${activeCalendar == null || activeCalendar.enabled}">
                    <span th:replace="~{fragments/icon :: icon(name='add', size='md')}"></span>
                    Add Session
                </a>
            </div>
        </div>
    </div>

    <!-- Filters. Search stays out where it can be reached; the three selects would take the
         whole screen on a phone, so they fold behind a toggle there and sit inline above it. -->
    <div class="sticky top-[72px] bg-background z-40 -mx-6 px-6 py-3 border-b border-outline-variant/30">
        <form id="filterForm" th:hx-get="@{/training-events}" hx-target="#events-list" hx-swap="outerHTML"
              hx-trigger="submit, change from:select" hx-push-url="false"
              class="flex flex-col md:flex-row gap-3">

            <!-- Carries the stats-page nudge's filter through every hx-include on this form,
                 so typing in the search box or changing a select does not silently drop it. -->
            <input type="hidden" name="awaitingConfirmation" th:if="${selectedAwaitingConfirmation}" value="true">

            <div class="flex items-center gap-2 md:flex-1">
                <input type="search" name="search" th:value="${search}" placeholder="Search sessions..."
                       class="form-input flex-1"
                       th:hx-get="@{/training-events}" hx-target="#events-list" hx-swap="outerHTML"
                       hx-include="#filterForm" hx-trigger="keyup changed delay:300ms">

                <button type="button" class="js-toggle btn-outline md:hidden shrink-0 relative"
                        data-toggle-target="#filterFields" aria-label="Show filters">
                    <span th:replace="~{fragments/icon :: icon(name='tune', size='md')}"></span>
                    <span th:if="${activeFilterCount != null && activeFilterCount > 0}"
                          th:text="${activeFilterCount}"
                          class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full
                                 bg-primary-container text-on-primary-container text-[11px] font-bold
                                 flex items-center justify-center">1</span>
                </button>
            </div>

            <div id="filterFields" class="hidden md:flex flex-col md:flex-row gap-3">
                <select name="eventTypes" class="form-select md:w-48"
                        th:hx-get="@{/training-events}" hx-target="#events-list" hx-swap="outerHTML"
                        hx-include="#filterForm">
                    <option value="">All types</option>
                    <option th:each="type : ${eventTypeOptions}" th:value="${type}" th:text="${type}"
                            th:selected="${selectedEventTypes != null && selectedEventTypes.contains(type)}">TRAINING</option>
                </select>

                <select name="attendanceStatuses" class="form-select md:w-48"
                        th:hx-get="@{/training-events}" hx-target="#events-list" hx-swap="outerHTML"
                        hx-include="#filterForm">
                    <option value="">All statuses</option>
                    <option th:each="status : ${attendanceStatusOptions}" th:value="${status}" th:text="${status}"
                            th:selected="${selectedStatuses != null && selectedStatuses.contains(status)}">PLANNED</option>
                </select>

                <select name="categoryIds" class="form-select md:w-48"
                        th:hx-get="@{/training-events}" hx-target="#events-list" hx-swap="outerHTML"
                        hx-include="#filterForm">
                    <option value="">All styles</option>
                    <option th:each="category : ${danceCategories}" th:value="${category.id}" th:text="${category.name}"
                            th:selected="${selectedCategoryIds != null && selectedCategoryIds.contains(category.id)}">Standard</option>
                </select>
            </div>
        </form>
    </div>

    <!-- Agenda list (HTMX swap target) -->
    <div th:fragment="eventsList" id="events-list" class="space-y-lg">

        <th:block th:if="${events == null || events.isEmpty()}">
            <div th:replace="~{fragments/empty :: emptyState(icon='calendar_month', title='No training sessions yet', text='Log your first session and it will appear here and in your Google Calendar.', actionHref=${activeCalendar == null || activeCalendar.enabled ? '/training-events/new' : null}, actionLabel='Add Session')}"></div>
        </th:block>

        <!-- Feedback message following a bulk action -->
        <div th:if="${bulkMessage != null}"
             class="js-banner p-4 rounded-md bg-surface-container border border-outline-variant flex items-center justify-between text-body-md text-on-surface">
            <div class="flex items-center gap-2">
                <span th:replace="~{fragments/icon :: icon(name='info', size='md', cls='text-primary')}"></span>
                <span th:text="${bulkMessage}">3 sessions marked as attended.</span>
            </div>
            <button type="button" class="js-dismiss-banner text-outline hover:text-on-surface" aria-label="Dismiss">
                <span th:replace="~{fragments/icon :: icon(name='close', size='sm')}"></span>
            </button>
        </div>

        <!-- List header with select-all control -->
        <div th:if="${events != null && !events.isEmpty()}"
             class="flex items-center justify-between py-2 px-1 border-b border-outline-variant/30">
            <label class="inline-flex items-center gap-2 cursor-pointer text-body-md font-medium text-on-surface select-none">
                <input type="checkbox" id="selectAllSessions" class="js-select-all-sessions rounded border-border text-primary focus:ring-primary w-4 h-4 cursor-pointer" aria-label="Select all sessions">
                <span id="selectAllLabel">Select all</span>
            </label>
            <span class="text-label-sm text-outline tabular-nums" th:text="${#lists.size(events)} + ' sessions'">6 sessions</span>
        </div>

        <!-- Floating bulk action bar -->
        <form id="bulkActionBar" th:hx-post="@{/training-events/bulk-attendance}"
              hx-target="#events-list" hx-swap="outerHTML"
              hx-include=".js-session-checkbox:checked, #filterForm"
              class="hidden fixed bottom-20 md:bottom-8 left-1/2 -translate-x-1/2 z-40
                     bg-surface-container-high border border-outline-variant shadow-ambient
                     rounded-xl px-4 py-3 items-center justify-between gap-3
                     max-w-[calc(100vw-2rem)] sm:max-w-2xl w-full sm:w-auto">
            <div class="flex items-center gap-2">
                <span id="bulkSelectedCount" class="font-medium text-on-surface text-body-md whitespace-nowrap">0 selected</span>
            </div>
            <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
                <button type="submit" name="status" value="ATTENDED"
                        class="btn-primary text-sm px-3 py-1.5 whitespace-nowrap">
                    Mark Attended
                </button>
                <button type="submit" name="status" value="SKIPPED"
                        class="btn-outline text-sm px-3 py-1.5 whitespace-nowrap">
                    Mark Skipped
                </button>
                <button type="button"
                        th:hx-post="@{/training-events/bulk-edit-type-dialog}"
                        hx-target="#confirmModalContainer"
                        hx-swap="innerHTML"
                        hx-include=".js-session-checkbox:checked, #filterForm"
                        class="btn-outline text-sm px-3 py-1.5 whitespace-nowrap">
                    Change Type
                </button>
                <button type="button"
                        th:hx-post="@{/training-events/bulk-edit-styles-dialog}"
                        hx-target="#confirmModalContainer"
                        hx-swap="innerHTML"
                        hx-include=".js-session-checkbox:checked, #filterForm"
                        class="btn-outline text-sm px-3 py-1.5 whitespace-nowrap">
                    Set Styles
                </button>
                <button type="button"
                        th:hx-post="@{/training-events/bulk-edit-material-dialog}"
                        hx-target="#confirmModalContainer"
                        hx-swap="innerHTML"
                        hx-include=".js-session-checkbox:checked, #filterForm"
                        class="btn-outline text-sm px-3 py-1.5 whitespace-nowrap">
                    Set Note
                </button>
                <button type="button"
                        th:hx-post="@{/training-events/bulk-delete-dialog}"
                        hx-target="#confirmModalContainer"
                        hx-swap="innerHTML"
                        hx-include=".js-session-checkbox:checked, #filterForm"
                        class="btn-outline text-sm px-3 py-1.5 whitespace-nowrap text-danger border-danger/30 hover:bg-danger-soft">
                    Delete
                </button>
                <button type="button" class="js-bulk-clear btn-icon text-on-surface-variant hover:text-on-surface ml-1"
                        title="Clear selection" aria-label="Clear selection">
                    <span th:replace="~{fragments/icon :: icon(name='close', size='sm')}"></span>
                </button>
            </div>
        </form>

        <!-- A training log is read in months: how much was scheduled, how many hours it came to. -->
        <div th:each="group : ${monthGroups}" class="space-y-gutter">

            <div class="tc-month-heading">
                <h2 class="font-headline-md text-xl font-semibold text-on-surface" th:text="${group.label}">September 2026</h2>
                <p class="font-body-md text-[14px] text-on-surface-variant tabular-nums">
                    <span th:text="${group.sessionLabel}">6 sessions</span>
                    <span class="text-outline"> · </span>
                    <span th:text="${group.totalLabel}">9h 30m</span>
                </p>
            </div>

            <div th:each="row : ${group.rows}" th:with="event=${row.event}"
                 class="card p-4 sm:p-5 flex items-start gap-3 sm:gap-4">

                <input type="checkbox" name="sessionIds" th:value="${event.id}"
                       class="js-session-checkbox mt-3 sm:mt-3.5 rounded border-border text-primary focus:ring-primary w-4 h-4 cursor-pointer shrink-0"
                       aria-label="Select session">

                <!-- Date rail; the stripe and tint are the session's status. -->
                <div class="tc-rail"
                     th:style="'border-left-color:' + ${row.swatch.color} + ';background-color:' + ${row.swatch.tint}">
                    <span class="tc-rail-day" th:text="${#temporals.format(event.startTime, 'd')}">10</span>
                    <span class="tc-rail-weekday" th:text="${#temporals.format(event.startTime, 'EEE')}">Thu</span>
                </div>

                <div class="flex-1 min-w-0">
                    <a th:href="@{/training-events/{id}(id=${event.id})}"
                       class="block truncate font-headline-lg text-base sm:text-lg font-semibold text-on-surface
                              hover:text-primary transition-colors"
                       th:text="${event.title}">Monday practice</a>

                    <p class="font-body-md text-[14px] sm:text-body-md text-on-surface-variant mt-0.5 tabular-nums">
                        <span th:text="${#temporals.format(event.startTime, 'HH:mm')} + '–' + ${#temporals.format(event.endTime, 'HH:mm')}">18:00–20:00</span>
                        <span class="text-outline"> · </span>
                        <span th:text="${event.durationMinutes} + ' min'">120 min</span>
                    </p>

                    <div class="tc-badges mt-2">
                        <span class="badge-primary" th:text="${event.eventType}">TRAINING</span>

                        <span th:each="segment : ${event.segments}" class="badge-secondary"
                              th:text="${segment.danceCategory.name} + ' ' + ${segment.durationMinutes} + 'min'">Standard 60min</span>

                        <span th:if="${event.isAwaitingConfirmation}" class="badge-accent">Needs confirmation</span>

                        <span th:unless="${event.isAwaitingConfirmation}"
                              th:classappend="${event.attendanceStatus.name() == 'ATTENDED' ? 'badge-success' :
                                                event.attendanceStatus.name() == 'SKIPPED' ? 'badge-danger' :
                                                event.attendanceStatus.name() == 'CANCELLED' ? 'badge-neutral' : 'badge-neutral'}"
                              th:text="${event.attendanceStatus}">PLANNED</span>
                    </div>

                    <!-- One-tap confirmation for a past session still marked PLANNED. It sits in
                         the body rather than the action column so a phone is not asked to fit
                         four 48px controls on one row. -->
                    <div th:if="${event.isAwaitingConfirmation}" class="flex flex-wrap gap-2 mt-3">
                        <form th:hx-post="@{/training-events/{id}/attendance(id=${event.id})}"
                              hx-target="#events-list" hx-swap="outerHTML">
                            <input type="hidden" name="status" value="ATTENDED">
                            <button type="submit" class="btn-primary">Attended</button>
                        </form>
                        <form th:hx-post="@{/training-events/{id}/attendance(id=${event.id})}"
                              hx-target="#events-list" hx-swap="outerHTML">
                            <input type="hidden" name="status" value="SKIPPED">
                            <button type="submit" class="btn-outline">Skipped</button>
                        </form>
                    </div>
                </div>

                <!-- Edit and delete: inline on a pointer, behind an overflow menu on a phone. -->
                <div class="hidden md:flex items-center gap-2 shrink-0">
                    <a th:href="@{/training-events/{id}/edit(id=${event.id})}" class="btn-outline btn-sm flex items-center gap-1.5" title="Edit">
                        <span th:replace="~{fragments/icon :: icon(name='edit', size='sm')}"></span>
                        <span>Edit</span>
                    </a>
                    <button th:if="${event.series != null}"
                            type="button"
                            class="btn-outline btn-sm text-danger hover:bg-danger-soft border-danger/30 hover:border-danger flex items-center gap-1.5"
                            title="Delete"
                            th:hx-get="@{/training-events/{id}/delete-dialog(id=${event.id})}"
                            hx-target="#confirmModalContainer"
                            hx-swap="innerHTML">
                        <span th:replace="~{fragments/icon :: icon(name='delete', size='sm')}"></span>
                        <span>Delete</span>
                    </button>
                    <form th:if="${event.series == null}"
                          th:action="@{/training-events/{id}/delete(id=${event.id})}" method="post"
                          data-confirm="Delete this training session? It will also be removed from your Google Calendar.">
                        <button type="submit" class="btn-outline btn-sm text-danger hover:bg-danger-soft border-danger/30 hover:border-danger flex items-center gap-1.5" title="Delete">
                            <span th:replace="~{fragments/icon :: icon(name='delete', size='sm')}"></span>
                            <span>Delete</span>
                        </button>
                    </form>
                </div>

                <div class="relative md:hidden shrink-0">
                    <button type="button" class="js-menu-btn btn-icon" aria-label="More actions">
                        <span th:replace="~{fragments/icon :: icon(name='more_vert', size='md')}"></span>
                    </button>
                    <div class="js-menu-dropdown hidden absolute right-0 top-full mt-1 w-44 z-30 py-1
                                rounded-md border border-outline-variant bg-surface-container-lowest shadow-ambient">
                        <a th:href="@{/training-events/{id}/edit(id=${event.id})}"
                           class="flex items-center gap-2 px-3 py-2 font-body-md text-[15px] text-on-surface hover:bg-surface-container">
                            <span th:replace="~{fragments/icon :: icon(name='edit', size='sm')}"></span>
                            Edit
                        </a>
                        <button th:if="${event.series != null}"
                                type="button"
                                class="flex w-full items-center gap-2 px-3 py-2 font-body-md text-[15px] text-error hover:bg-surface-container"
                                th:hx-get="@{/training-events/{id}/delete-dialog(id=${event.id})}"
                                hx-target="#confirmModalContainer"
                                hx-swap="innerHTML">
                            <span th:replace="~{fragments/icon :: icon(name='delete', size='sm')}"></span>
                            Delete
                        </button>
                        <form th:if="${event.series == null}"
                              th:action="@{/training-events/{id}/delete(id=${event.id})}" method="post"
                              data-confirm="Delete this training session? It will also be removed from your Google Calendar.">
                            <button type="submit"
                                    class="flex w-full items-center gap-2 px-3 py-2 font-body-md text-[15px] text-error hover:bg-surface-container">
                                <span th:replace="~{fragments/icon :: icon(name='delete', size='sm')}"></span>
                                Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</html>
