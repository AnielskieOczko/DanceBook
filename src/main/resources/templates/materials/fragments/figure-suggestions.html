<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Suggestions panel: shown when the LLM found 1–3 matching figures -->
<section th:fragment="suggestionsPanel"
         aria-labelledby="sugg-title"
         class="rounded-xl bg-surface-container/50 border border-outline-variant p-4 space-y-3">

    <div class="flex items-center gap-2">
        <span th:replace="~{fragments/icon :: icon(name='auto_awesome', size='sm', cls='text-primary flex-shrink-0')}"></span>
        <h3 id="sugg-title" class="m-0 text-sm font-semibold text-on-surface" th:text="#{notes.suggestions.title}">Suggested from this note</h3>
    </div>

    <div th:each="s : ${suggestions}" class="flex gap-3 items-start">
        <div class="flex-grow min-w-0 flex flex-col gap-0.5">
            <span class="text-[15px] font-semibold leading-snug text-on-surface"
                  th:text="${s.figure.name}">Figure Name</span>
            <span th:if="${s.figure.danceClass != null or s.reason != null}"
                  class="text-[13px] text-on-surface-variant leading-snug">
                <th:block th:if="${s.figure.danceClass != null}"
                          th:text="#{notes.figures.class_dot(${s.figure.danceClass})}"></th:block><th:block th:if="${s.reason != null}"><th:block th:text="#{notes.suggestions.note_says}">Note says </th:block><q class="text-on-surface" th:text="${s.reason}">quoted phrase</q></th:block>
            </span>
        </div>
        <div class="js-suggestion-action shrink-0">
            <form th:action="@{/materials/{mId}/figures(mId=${material.id})}"
                  method="post"
                  th:hx-post="@{/materials/{mId}/figures(mId=${material.id})}"
                  hx-target="closest .js-suggestion-action"
                  hx-swap="outerHTML">
                <input type="hidden" name="danceFigureId" th:value="${s.figure.id}" />
                <button type="submit"
                        class="btn-primary btn-sm flex items-center gap-1"
                        title="Pin figure"
                        aria-label="Pin figure"
                        th:title="#{notes.figures.pin}"
                        th:attr="aria-label=#{notes.figures.pin}">
                    <span th:replace="~{fragments/icon :: icon(name='push_pin', size='sm')}"></span>
                    <span th:text="#{notes.picker.pin}">Pin</span>
                </button>
            </form>
        </div>
    </div>
</section>

<!-- Empty state: LLM found no clear matches -->
<div th:fragment="suggestionsEmpty">
    <div th:replace="~{fragments/alert :: alert(variant='info', text=#{notes.suggestions.empty})}"></div>
</div>

<!-- Error state: provider failure or access error -->
<div th:fragment="suggestionsError" class="space-y-3">
    <div th:replace="~{fragments/alert :: alert(variant='error', text=${suggestError})}"></div>
    <!--/* Only a provider failure is worth retrying; it re-runs the same request into #figureSuggestions */-->
    <button th:if="${suggestRetry == true}"
            type="button"
            id="figure-suggest-retry-btn"
            class="btn-outline btn-sm flex items-center gap-1.5"
            th:hx-get="@{/materials/{id}/figures/suggest(id=${material.id})}"
            hx-target="#figureSuggestions"
            hx-swap="innerHTML"
            hx-indicator="#figure-suggest-retry-btn"
            hx-disabled-elt="this">
        <span th:replace="~{fragments/icon :: icon(name='refresh', size='sm', cls='text-primary')}"></span>
        <span th:text="#{common.retry}">Try again</span>
        <span class="htmx-indicator" aria-hidden="true">
            <span th:replace="~{fragments/icon :: icon(name='autorenew', size='sm', cls='animate-spin text-primary')}"></span>
        </span>
    </button>
</div>

</body>
</html>
