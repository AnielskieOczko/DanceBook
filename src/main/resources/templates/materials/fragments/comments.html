<div th:fragment="comment-list" id="comment-section" class="space-y-6">
    <h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2">
        <span th:text="#{notes.comments.title}">Comments</span>
        <span class="font-normal text-on-surface-variant" th:text="${comments != null ? #lists.size(comments) : 0}">0</span>
    </h2>

    <!-- Error Alert -->
    <div th:if="${commentError != null}">
        <div th:replace="~{fragments/alert :: alert(variant='error', text=${commentError})}"></div>
    </div>

    <!-- Input Area -->
    <div>
        <form th:hx-post="@{/materials/{id}/comments(id=${material.id})}"
              hx-target="#comment-section"
              hx-swap="outerHTML"
              class="flex gap-3 sm:gap-4 items-start">
            <div class="comment-avatar">
                <span th:text="${currentUser != null && currentUser.displayName != null ? currentUser.displayName.substring(0,1) : 'U'}">U</span>
            </div>
            <div class="flex-1 min-w-0">
                <div th:replace="~{fragments/form :: richText(path='content', raw=true, required=true, placeholder=#{notes.comments.placeholder}, id='comment-content', hasError=${commentError != null})}"></div>
                <div class="flex justify-end mt-2">
                    <button type="submit" class="btn-primary btn-sm" th:text="#{notes.comments.post}">Post comment</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Comments List -->
    <div class="border-b border-outline-variant">
        <th:block th:each="c : ${comments}">
            <div th:replace="~{materials/fragments/comments :: comment-item}"></div>
        </th:block>
        <div th:if="${#lists.isEmpty(comments)}" class="text-sm text-on-surface-variant italic py-3" th:text="#{notes.comments.empty}">
            No comments yet.
        </div>
    </div>
</div>

<div th:fragment="comment-item" class="comment-item group">
    <div class="comment-avatar">
        <span th:text="${c.author != null && c.author.displayName != null && c.author.displayName.length() > 0 ? c.author.displayName.substring(0,1) : '?'}">U</span>
    </div>
    <div class="flex items-baseline justify-between gap-2 flex-wrap min-w-0">
        <div class="flex items-center gap-2 min-w-0">
            <span class="font-semibold text-sm text-on-surface truncate" th:text="${c.author != null ? c.author.displayName : ''}">Marcus T.</span>
            <span th:if="${c.updatedAt != null}" class="text-[10px] text-outline uppercase font-medium" th:text="#{notes.comments.edited}">Edited</span>
        </div>
        <span class="text-xs text-on-surface-variant shrink-0"
              th:text="${#temporals.format(c.updatedAt ?: c.createdAt, 'dd MMM')}">2 days ago</span>
    </div>
    <div class="min-w-0">
        <div th:replace="~{fragments/rich-text :: content(value=${c.content})}"></div>
        
        <!-- Actions -->
        <div class="flex gap-1 mt-1 -ml-2" th:if="${(currentUser != null and c.author != null and currentUser.id == c.author.id) or #authorization.expression('hasRole(''ADMIN'')')}">
            <button th:if="${currentUser != null and c.author != null and currentUser.id == c.author.id}"
                    th:hx-get="@{/materials/{mId}/comments/{cId}/edit(mId=${material.id}, cId=${c.id})}"
                    hx-target="closest .group"
                    hx-swap="outerHTML"
                    type="button"
                    class="link-pill"
                    th:text="#{common.edit}">Edit</button>
            <button th:if="${(currentUser != null and c.author != null and currentUser.id == c.author.id) or #authorization.expression('hasRole(''ADMIN'')')}"
                    th:hx-delete="@{/materials/{mId}/comments/{cId}(mId=${material.id}, cId=${c.id})}"
                    hx-target="closest .group"
                    hx-swap="outerHTML"
                    th:hx-confirm="#{notes.comments.delete_confirm}"
                    type="button"
                    class="link-pill del"
                    th:text="#{common.delete}">Delete</button>
        </div>
    </div>
</div>

<div th:fragment="comment-edit-form" class="group flex gap-3 sm:gap-4 py-3 border-t border-outline-variant min-w-0">
    <div class="comment-avatar">
        <span th:text="${comment != null && comment.author?.displayName != null ? comment.author.displayName.substring(0,1) : 'U'}">U</span>
    </div>
    <div class="comment-card comment-card-editing" th:classappend="${commentError != null} ? 'border-error! ring-error/20!' : ''">
        <!-- Error Alert -->
        <div th:if="${commentError != null}" class="mb-4">
            <div th:replace="~{fragments/alert :: alert(variant='error', text=${commentError})}"></div>
        </div>
        <div class="flex justify-between items-baseline gap-2 flex-wrap mb-2">
            <span class="font-semibold text-sm text-on-surface" th:text="${comment != null && comment.author?.displayName != null ? comment.author.displayName : ''}">Marcus T.</span>
            <span class="text-xs text-on-surface-variant" th:text="#{notes.comments.editing}">Editing</span>
        </div>
        <form th:hx-put="@{/materials/{mId}/comments/{cId}(mId=${material.id}, cId=${comment.id})}"
              hx-target="closest .group"
              hx-swap="outerHTML">
            <div th:replace="~{fragments/form :: richText(path='content', raw=true, required=true, value=${comment.content}, id='comment-edit-' + ${comment.id}, cls='comment-edit-editor', hasError=${commentError != null})}"></div>
            <div class="flex gap-2 mt-2 justify-end">
                <button type="button"
                        th:hx-get="@{/materials/{mId}/comments/{cId}(mId=${material.id}, cId=${comment.id})}"
                        hx-target="closest .group"
                        hx-swap="outerHTML"
                        class="btn-ghost btn-sm"
                        th:text="#{common.cancel}">Cancel</button>
                <button type="submit" class="btn-primary btn-sm" th:text="#{common.save}">Save</button>
            </div>
        </form>
    </div>
</div>
