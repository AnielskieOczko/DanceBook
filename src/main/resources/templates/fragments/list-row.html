<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!--
  Compact Row Component for mobile list items (Issue #366, Mock Option A).
  Fixed-height row with hairline divider, full-row tap target, single-line trimmed metadata,
  tag overflow marker, and trailing ⋯ overflow menu.
-->
<article th:fragment="compactRow"
         class="js-compact-row group relative flex items-center justify-between gap-3 px-4 h-[76px] shrink-0 border-b border-outline-variant hover:bg-surface-container-low transition-colors has-[.js-menu-dropdown:not(.hidden)]:z-30 list-fade-in"
         th:classappend="${(isRelated == true ? 'bg-primary-container/5' : '') + (cls != null ? ' ' + cls : '')}">

    <!-- Stretched link for full-row tap target -->
    <a th:href="${href}" class="absolute inset-0 z-0 rounded-none focus:outline-hidden">
        <span class="sr-only" th:text="${title}">View item</span>
    </a>

    <!-- Main content: title line, then one line of badges (mock option A, two lines) -->
    <div class="flex-1 min-w-0 pointer-events-none relative z-10">
        <!-- Title row: title, optional marker (e.g. the private lock), aside text (e.g. the date) on the right -->
        <div class="flex items-center gap-2 min-w-0">
            <h3 class="text-base leading-[22px] font-semibold text-on-surface truncate min-w-0 group-hover:text-primary transition-colors" th:text="${title}">Title</h3>
            <th:block th:if="${titleMarkerSlot != null}">
                <th:block th:replace="${titleMarkerSlot}"></th:block>
            </th:block>
            <th:block th:if="${isRelated == true}">
                <span th:replace="~{fragments/badge :: badge(label=#{search.chip.related}, variant='related')}"></span>
            </th:block>
            <span th:if="${asideText != null}"
                  class="ml-auto shrink-0 text-[13px] font-medium text-on-surface-variant whitespace-nowrap"
                  th:text="${asideText}">14 Oct</span>
        </div>

        <!-- Badge line: one row, trimmed with a +N marker when it does not fit -->
        <div th:if="${tagsSlot != null}" class="js-row-tags flex items-center gap-1.5 mt-1.5 flex-nowrap overflow-hidden">
            <th:block th:replace="${tagsSlot}"></th:block>
        </div>
    </div>

    <!-- Trailing Action Slot (#425): a 56px, full-row-height column flush with the right edge
         (-mr-4 cancels the row's px-4). It sits above the stretched link, so a tap anywhere in it
         hits the slot, never the link; the 44px ⋯ button is centred with 6px of buffer around it. -->
    <div th:if="${menuSlot != null}"
         class="js-row-trailing relative z-20 pointer-events-auto shrink-0 self-stretch -mr-4 w-14 flex items-center justify-center">
        <div th:replace="~{fragments/page :: overflowMenu(menuSlot=${menuSlot}, quiet=true)}"></div>
    </div>
</article>

</body>
</html>
