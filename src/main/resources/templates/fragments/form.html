<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Standard Form Input Field -->
<div th:fragment="field" class="form-group" th:classappend="${cls}">
    <label th:if="${label != null}" th:for="${id ?: path}" class="form-label">
        <span th:text="${label}">Label</span>
        <span th:if="${required == true}" class="text-error font-bold" aria-hidden="true"> *</span>
    </label>
    <th:block th:if="${springBoundObjectExpression != null and bound != false and raw != true}">
        <input th:id="${id ?: path}"
               th:type="${type ?: 'text'}"
               th:field="*{__${path}__}"
               th:required="${required == true}"
               th:placeholder="${placeholder}"
               th:disabled="${disabled == true}"
               th:readonly="${readonly == true}"
               th:autocomplete="${autocomplete}"
               th:min="${min}"
               th:max="${max}"
               th:step="${step}"
               class="form-input"
               th:classappend="${#fields.hasErrors(path)} ? 'form-input-invalid' : ''" />
        <p th:if="${#fields.hasErrors(path)}" th:errors="*{__${path}__}" class="form-error">Error</p>
    </th:block>
    <th:block th:if="${springBoundObjectExpression == null or bound == false or raw == true}">
        <input th:id="${id ?: path}"
               th:name="${path}"
               th:value="${value}"
               th:type="${type ?: 'text'}"
               th:required="${required == true}"
               th:placeholder="${placeholder}"
               th:disabled="${disabled == true}"
               th:readonly="${readonly == true}"
               th:autocomplete="${autocomplete}"
               th:min="${min}"
               th:max="${max}"
               th:step="${step}"
               class="form-input" />
    </th:block>
    <p th:if="${hint != null and ((springBoundObjectExpression == null or bound == false or raw == true) or !#fields.hasErrors(path))}"
       th:id="${hintId}"
       class="form-hint" th:text="${hint}">Hint</p>
</div>

<!-- Select Dropdown -->
<div th:fragment="selectField" class="form-group" th:classappend="${cls}">
    <label th:if="${label != null}" th:for="${id ?: path}" class="form-label">
        <span th:text="${label}">Label</span>
        <span th:if="${required == true}" class="text-error font-bold" aria-hidden="true"> *</span>
    </label>
    <th:block th:if="${springBoundObjectExpression != null and bound != false and raw != true}">
        <select th:id="${id ?: path}"
                th:field="*{__${path}__}"
                th:required="${required == true}"
                th:disabled="${disabled == true}"
                th:multiple="${multiple == true}"
                class="form-select"
                th:classappend="${#fields.hasErrors(path)} ? 'form-input-invalid' : ''">
            <option th:if="${placeholder != null}" value="" th:text="${placeholder}">Select...</option>
            <option th:each="opt : ${options}"
                    th:value="${optValue != null ? opt[optValue] : opt}"
                    th:text="${msgPrefix != null ? #messages.msg(msgPrefix + opt.toString()) : (optLabel != null ? opt[optLabel] : opt)}">Option</option>
        </select>
        <p th:if="${#fields.hasErrors(path)}" th:errors="*{__${path}__}" class="form-error">Error</p>
    </th:block>
    <th:block th:if="${springBoundObjectExpression == null or bound == false or raw == true}">
        <select th:id="${id ?: path}"
                th:name="${path}"
                th:required="${required == true}"
                th:disabled="${disabled == true}"
                th:multiple="${multiple == true}"
                class="form-select">
            <option th:if="${placeholder != null}" value="" th:text="${placeholder}">Select...</option>
            <option th:each="opt : ${options}"
                    th:value="${optValue != null ? opt[optValue] : opt}"
                    th:text="${msgPrefix != null ? #messages.msg(msgPrefix + opt.toString()) : (optLabel != null ? opt[optLabel] : opt)}"
                    th:selected="${(optValue != null ? opt[optValue] : opt) == value}">Option</option>
        </select>
    </th:block>
    <p th:if="${hint != null and ((springBoundObjectExpression == null or bound == false or raw == true) or !#fields.hasErrors(path))}"
       th:id="${hintId}"
       class="form-hint" th:text="${hint}">Hint</p>
</div>

<!-- Textarea -->
<div th:fragment="textareaField" class="form-group" th:classappend="${cls}">
    <label th:if="${label != null}" th:for="${id ?: path}" class="form-label">
        <span th:text="${label}">Label</span>
        <span th:if="${required == true}" class="text-error font-bold" aria-hidden="true"> *</span>
    </label>
    <th:block th:if="${springBoundObjectExpression != null and bound != false and raw != true}">
        <textarea th:id="${id ?: path}"
                  th:field="*{__${path}__}"
                  th:rows="${rows ?: 4}"
                  th:required="${required == true}"
                  th:placeholder="${placeholder}"
                  th:disabled="${disabled == true}"
                  th:readonly="${readonly == true}"
                  class="form-textarea"
                  th:classappend="${#fields.hasErrors(path)} ? 'form-input-invalid' : ''"></textarea>
        <p th:if="${#fields.hasErrors(path)}" th:errors="*{__${path}__}" class="form-error">Error</p>
    </th:block>
    <th:block th:if="${springBoundObjectExpression == null or bound == false or raw == true}">
        <textarea th:id="${id ?: path}"
                  th:name="${path}"
                  th:rows="${rows ?: 4}"
                  th:required="${required == true}"
                  th:placeholder="${placeholder}"
                  th:disabled="${disabled == true}"
                  th:readonly="${readonly == true}"
                  class="form-textarea"
                  th:text="${value}"></textarea>
    </th:block>
    <p th:if="${hint != null and ((springBoundObjectExpression == null or bound == false or raw == true) or !#fields.hasErrors(path))}"
       th:id="${hintId}"
       class="form-hint" th:text="${hint}">Hint</p>
</div>

<!-- Checkbox -->
<div th:fragment="checkbox" class="form-group" th:classappend="${cls}">
    <label class="inline-flex items-center gap-2 cursor-pointer select-none">
        <th:block th:if="${springBoundObjectExpression != null and bound != false and raw != true}">
            <input th:id="${id ?: path}"
                   type="checkbox"
                   th:field="*{__${path}__}"
                   th:disabled="${disabled == true}"
                   class="rounded border-outline text-primary focus:ring-primary w-4 h-4" />
        </th:block>
        <th:block th:if="${springBoundObjectExpression == null or bound == false or raw == true}">
            <input th:id="${id ?: path}"
                   th:name="${path}"
                   type="checkbox"
                   th:checked="${value == true}"
                   th:disabled="${disabled == true}"
                   class="rounded border-outline text-primary focus:ring-primary w-4 h-4" />
        </th:block>
        <span th:if="${label != null}" class="text-sm font-semibold text-on-surface" th:text="${label}">Label</span>
    </label>
    <p th:if="${hint != null}" class="form-hint ml-6" th:text="${hint}">Hint</p>
</div>

<!-- Toggle Switch -->
<div th:fragment="toggle" class="form-group" th:classappend="${cls}">
    <label class="inline-flex items-center gap-3 cursor-pointer select-none">
        <th:block th:if="${springBoundObjectExpression != null and bound != false and raw != true}">
            <input th:id="${id ?: path}"
                   type="checkbox"
                   th:field="*{__${path}__}"
                   th:disabled="${disabled == true}"
                   class="sr-only peer" />
        </th:block>
        <th:block th:if="${springBoundObjectExpression == null or bound == false or raw == true}">
            <input th:id="${id ?: path}"
                   th:name="${path}"
                   type="checkbox"
                   th:checked="${value == true}"
                   th:disabled="${disabled == true}"
                   class="sr-only peer" />
        </th:block>
        <div class="w-11 h-6 bg-surface-container border border-outline rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-outline after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary relative"></div>
        <span th:if="${label != null}" class="text-sm font-semibold text-on-surface" th:text="${label}">Label</span>
    </label>
    <p th:if="${hint != null}" class="form-hint" th:text="${hint}">Hint</p>
</div>

<!-- Rich Text Editor Field (Trix) -->
<div th:fragment="richText" class="form-group" th:classappend="${cls}">
    <label th:if="${label != null}" th:id="${(id ?: path) + '_label'}" th:for="${id ?: path}" class="form-label">
        <span th:text="${label}">Label</span>
        <span th:if="${required == true}" class="text-error font-bold" aria-hidden="true"> *</span>
    </label>
    <th:block th:if="${springBoundObjectExpression != null and bound != false and raw != true}">
        <input type="hidden"
               th:id="${(id ?: path) + '_input'}"
               th:field="*{__${path}__}"
               th:disabled="${disabled == true}" />
        <trix-editor th:id="${id ?: path}"
                     th:input="${(id ?: path) + '_input'}"
                     th:placeholder="${placeholder}"
                     th:disabled="${disabled == true}"
                     th:attr="data-required=${required == true ? 'true' : null},aria-labelledby=${label != null ? (id ?: path) + '_label' : null},aria-label=${label == null && placeholder != null ? placeholder : null}"
                     class="trix-content"
                     th:classappend="${#fields.hasErrors(path)} ? 'border-error ring-1 ring-error' : ''"></trix-editor>
        <p th:if="${#fields.hasErrors(path)}" th:errors="*{__${path}__}" class="form-error">Error</p>
    </th:block>
    <th:block th:if="${springBoundObjectExpression == null or bound == false or raw == true}">
        <input type="hidden"
               th:id="${(id ?: path) + '_input'}"
               th:name="${path}"
               th:value="${value}"
               th:disabled="${disabled == true}" />
        <trix-editor th:id="${id ?: path}"
                     th:input="${(id ?: path) + '_input'}"
                     th:placeholder="${placeholder}"
                     th:disabled="${disabled == true}"
                     th:attr="data-required=${required == true ? 'true' : null},aria-labelledby=${label != null ? (id ?: path) + '_label' : null},aria-label=${label == null && placeholder != null ? placeholder : null}"
                     class="trix-content"
                     th:classappend="${hasError == true} ? 'border-error' : ''"></trix-editor>
    </th:block>
    <p th:if="${hint != null and ((springBoundObjectExpression == null or bound == false or raw == true) or !#fields.hasErrors(path))}" class="form-hint" th:text="${hint}">Hint</p>
</div>

<!-- Error Summary Box -->
<div th:fragment="errorSummary"
     th:if="${#fields != null and #fields.hasErrors('*')}"
     th:id="${id ?: 'errorSummary'}"
     role="alert"
     class="p-4 rounded-md bg-error/10 border border-error mb-6"
     th:classappend="${cls}">
    <div class="flex items-center gap-2 text-error font-semibold text-base mb-2">
        <span th:replace="~{fragments/icon :: icon(name='error', size='md')}"></span>
        <span th:text="${title ?: #messages.msg('form.error_summary.title')}">Please correct the following errors:</span>
    </div>
    <ul class="list-disc list-inside text-sm text-error space-y-1">
        <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error</li>
    </ul>
</div>

<!-- Raw Field for forms without backing model objects (e.g. comment posting) -->
<div th:fragment="rawField" class="form-group" th:classappend="${cls}">
    <label th:if="${label != null}" th:for="${id ?: name}" class="form-label">
        <span th:text="${label}">Label</span>
        <span th:if="${required == true}" class="text-error font-bold" aria-hidden="true"> *</span>
    </label>
    <input th:id="${id ?: name}"
           th:name="${name}"
           th:value="${value}"
           th:type="${type ?: 'text'}"
           th:required="${required == true}"
           th:placeholder="${placeholder}"
           th:disabled="${disabled == true}"
           th:readonly="${readonly == true}"
           class="form-input" />
    <p th:if="${hint != null}" class="form-hint" th:text="${hint}">Hint</p>
</div>

<!-- Search Input Field (List toolbar and picker dialogs) -->
<div th:fragment="searchField" class="relative flex-1 group" th:classappend="${cls}">
    <span th:replace="~{fragments/icon :: icon(name='search', size='md', cls='absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors')}"></span>
    <input th:id="${id ?: (name ?: 'search')}"
           th:name="${name ?: 'search'}"
           th:value="${value}"
           th:type="${type ?: 'search'}"
           th:placeholder="${placeholder}"
           th:aria-label="${ariaLabel ?: placeholder}"
           autocomplete="off"
           class="pill-input pl-11"
           th:classappend="${inputCls}"
           th:attr="hx-get=${hxGet},hx-target=${hxTarget},hx-swap=${hxSwap},hx-include=${hxInclude},hx-trigger=${hxTrigger}" />
</div>

<!-- Filter Select Dropdown (List toolbar and collapsible filters) -->
<div th:fragment="filterSelect" th:class="${label != null ? 'flex flex-col gap-1' + (cls != null ? ' ' + cls : '') : (cls ?: '')}">
    <label th:if="${label != null}"
           th:for="${id ?: name}"
           class="text-label-sm font-label-sm text-outline uppercase tracking-wider"
           th:classappend="${labelCls}"
           th:text="${label}">Label</label>
    <select th:id="${id ?: name}"
            th:name="${name}"
            th:aria-label="${label == null ? (ariaLabel ?: placeholder) : null}"
            th:disabled="${disabled == true}"
            class="pill-select w-full"
            th:classappend="${selectCls}"
            th:attr="hx-get=${hxGet},hx-target=${hxTarget},hx-swap=${hxSwap},hx-include=${hxInclude},hx-trigger=${hxTrigger}">
        <th:block th:if="${optionsFragment != null}">
            <th:block th:replace="${optionsFragment}"></th:block>
        </th:block>
        <th:block th:if="${optionsFragment == null}">
            <option th:if="${placeholder != null}" th:value="${placeholderValue ?: ''}" th:text="${placeholder}">All...</option>
            <option th:each="opt : ${options}"
                    th:value="${optValue != null ? opt[optValue] : opt}"
                    th:text="${msgPrefix != null ? #messages.msg(msgPrefix + opt.toString()) : (optLabel != null ? opt[optLabel] : opt)}"
                    th:selected="${selectedValues != null ? #lists.contains(selectedValues, (optValue != null ? opt[optValue] : opt)) : (value != null and ((optValue != null ? opt[optValue] : opt).toString() == value.toString()))}">Option</option>
        </th:block>
    </select>
</div>

</body>
</html>
